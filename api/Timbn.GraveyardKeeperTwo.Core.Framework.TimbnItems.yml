    id: CountAnywhere
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Items/TimbnItems.cs
    startLine: 18
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Counts an item everywhere in the world, meaning the player's inventory, every storage and craft inventory,

    and every item lying on the ground or queued to drop. It stops looking once <code class="paramref">enough</code> is

    reached, so asking "is there at least this many" is cheap.
  example:
  - <pre><code class="lang-csharp">var hasEnough = TimbnItems.CountAnywhere("flitch", 2) &gt;= 2;</code></pre>
  syntax:
    content: public static int CountAnywhere(string id, int enough = 2147483647)
    parameters:
    - id: id
      type: System.String
      description: The item id.
    - id: enough
      type: System.Int32
      description: The count at which to stop looking. The default counts everything.
    return:
      type: System.Int32
      description: The count found, which is at least <code class="paramref">enough</code> if it stopped early.
    content.vb: Public Shared Function CountAnywhere(id As String, enough As Integer = 2147483647) As Integer
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnItems.CountAnywhere*
  nameWithType.vb: TimbnItems.CountAnywhere(String, Integer)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnItems.CountAnywhere(String, Integer)
  name.vb: CountAnywhere(String, Integer)
