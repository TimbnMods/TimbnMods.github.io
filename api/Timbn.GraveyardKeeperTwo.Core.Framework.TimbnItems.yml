    startLine: 62
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Finds items lying on the ground as pickups, including ones queued to drop in a scene that is not loaded

    right now. Drops already being picked up or removed are skipped.
  example:
  - >-
    Every log on the ground in the player's scene.


    <pre><code class="lang-csharp">var logs = TimbnItems.FindDrops(drop =&gt; drop.Id == "wood", TimbnPlayer.Scene);</code></pre>
  syntax:
    content: public static List<(GameSceneData Scene, DropData Drop)> FindDrops(Func<DropData, bool> match, GameSceneData? scene = null)
    parameters:
    - id: match
      type: System.Func{DropData,System.Boolean}
      description: Which drops to keep, such as by their Id.
    - id: scene
      type: GameSceneData
      description: Only look in this scene. Leave it out to look in every scene of the world.
    return:
      type: System.Collections.Generic.List{System.ValueTuple{GameSceneData,DropData}}
      description: Each matching drop with the scene it lies in, which is what <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnItems.RemoveDrops(System.Collections.Generic.IEnumerable%7bSystem.ValueTuple%7bGameSceneData%2cDropData%7d%7d)" data-throw-if-not-resolved="false"></xref> takes.
    content.vb: Public Shared Function FindDrops(match As Func(Of DropData, Boolean), scene As GameSceneData = Nothing) As List(Of (Scene As GameSceneData, Drop As DropData))
