  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    A line in the NPC's speech bubble with its text only in the plugin's lang files, under the talk or quest id plus

    this name, so Line("ask") in the offer of quest my_craving reads my_craving_offer_ask. Values fill %1, %2 and so

    on the same way as <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTalk%601.Say(System.String%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref>. A name with no line in lang/en.txt fails when the talk or quest is added.
  example:
  - <pre><code class="lang-csharp">talk.Line("ask").Accept(then =&gt; then.Line("thanks")).Decline()</code></pre>
  syntax:
    content: public TSelf Line(string name, params object[] values)
    parameters:
    - id: name
      type: System.String
      description: A short name of lowercase letters, digits and underscores, starting with a letter.
    - id: values
      type: System.Object[]
      description: The values for %1, %2 and so on.
    return:
      type: '{TSelf}'
      description: This conversation, for chaining.
    content.vb: Public Function Line(name As String, ParamArray values As Object()) As TSelf
