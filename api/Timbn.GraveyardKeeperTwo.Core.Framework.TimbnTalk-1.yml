  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The steps every conversation shares, for talks added with the plugin's Dialog.AddTalk and for quest

    conversations. Each line is the text itself, and Core turns it into a localization key named after the talk or

    quest, numbered in the order written, so a lang file can translate it. <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTalk%601.Named(System.String)" data-throw-if-not-resolved="false"></xref> gives a line a name of its

    own instead, and <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTalk%601.Line(System.String%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> leaves the text out of code and reads it from the plugin's lang files by name.

    The steps play in order, each waiting for the one before.
  example: []
  syntax:
    content: 'public abstract class TimbnTalk<TSelf> where TSelf : TimbnTalk<TSelf>'
    typeParameters:
    - id: TSelf
      description: The conversation type, so each step chains on the same type.
    content.vb: Public MustInherit Class TimbnTalk(Of TSelf As TimbnTalk(Of TSelf))
