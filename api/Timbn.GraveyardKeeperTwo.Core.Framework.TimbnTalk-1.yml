  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    A line in the NPC's speech bubble. The text can hold the game's placeholders %1, %2 and so on, filled from

    <code class="paramref">values</code> in order. A value that is a <code>Func&lt;object&gt;</code> is worked out when the line

    shows, so it can reflect what an earlier step changed.
  example:
  - >-
    <pre><code class="lang-csharp">Func&lt;object&gt; carried = () =&gt; TimbnItems.CountOnPlayer("flitch");

    talk.Say("You have %1 boards.", carried);</code></pre>
  syntax:
    content: public TSelf Say(string text, params object[] values)
    parameters:
    - id: text
      type: System.String
      description: The line.
    - id: values
      type: System.Object[]
      description: The values for %1, %2 and so on.
    return:
      type: '{TSelf}'
      description: This conversation, for chaining.
    content.vb: Public Function Say(text As String, ParamArray values As Object()) As TSelf
