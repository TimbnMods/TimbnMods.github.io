  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a potion as an item, buff, alchemy formula, and set of ingredient mixes, with its names and

    descriptions in the loaded language, and runs its buff hooks while the player has the buff. Registering

    an id that is already registered replaces it, ending the old copy's buff first.
  example: []
  syntax:
    content: public IDisposable Add(TimbnPotion potion)
    parameters:
    - id: potion
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPotion
      description: The potion to add. Its runes must not match any other formula, or it is skipped with a warning.
    return:
      type: System.IDisposable
      description: A handle that removes the potion early when disposed. You don't need to keep it.
    content.vb: Public Function Add(potion As TimbnPotion) As IDisposable
