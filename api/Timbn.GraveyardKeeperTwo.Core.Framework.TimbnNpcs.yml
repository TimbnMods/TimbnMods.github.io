    id: ReputationOf
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnNpcs.cs
    startLine: 109
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The id of the player's resource that holds their reputation with an NPC, such as rep_larry for Larry, or null

    for someone the game keeps no reputation with. Read it with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPlayer.GetResource(System.String)" data-throw-if-not-resolved="false"></xref> to gate on

    reputation outside a quest, where TimbnNeeds.Reputation does it for you.
  example:
  - <pre><code class="lang-csharp">var liked = TimbnNpcs.ReputationOf(TimbnGameIds.Npcs.Larry) is { } rep &amp;&amp; TimbnPlayer.GetResource(rep) &gt;= 20f;</code></pre>
  syntax:
    content: public static string? ReputationOf(string npcId)
    parameters:
    - id: npcId
      type: System.String
      description: The NPC, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.String
      description: The resource id, or null when the NPC has no reputation or the balance is not loaded.
    content.vb: Public Shared Function ReputationOf(npcId As String) As String
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcs.ReputationOf*
  nameWithType.vb: TimbnNpcs.ReputationOf(String)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcs.ReputationOf(String)
