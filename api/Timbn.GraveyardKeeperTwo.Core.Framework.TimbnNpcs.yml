  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The points of one of the game's life simulator groups, the places it sends villagers to, such as the tavern

    seats in the village group.
  example:
  - <pre><code class="lang-csharp">var seats = TimbnNpcs.GroupPoints(TimbnGameIds.Groups.VillagersDayAll, "npc_sim_village_tavern_");</code></pre>
  syntax:
    content: public static IReadOnlyList<string> GroupPoints(string groupId, string? prefix = null)
    parameters:
    - id: groupId
      type: System.String
      description: The group's id, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Groups" data-throw-if-not-resolved="false"></xref>.
    - id: prefix
      type: System.String
      description: Keeps only the points whose id starts with this. Leave it out for every point.
    return:
      type: System.Collections.Generic.IReadOnlyList{System.String}
      description: The point ids in id order, empty when the group is missing or at the main menu.
    content.vb: Public Shared Function GroupPoints(groupId As String, prefix As String = Nothing) As IReadOnlyList(Of String)
