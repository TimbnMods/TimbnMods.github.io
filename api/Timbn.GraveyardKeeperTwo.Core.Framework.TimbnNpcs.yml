    id: FacingAt
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnNpcs.cs
    startLine: 87
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The way a person faces when they stop on a point, such as Left for a seat at the end of a table, or null when

    the point does not exist or at the main menu. Use it to pick who goes to a point or what they play there.
  example:
  - >-
    <pre><code class="lang-csharp">if (TimbnNpcs.FacingAt("npc_sim_village_tavern_06") == Direction.Left)
        kind = TimbnGameIds.Npcs.Fisherman01;</code></pre>
  syntax:
    content: public static Direction? FacingAt(string pointId)
    parameters:
    - id: pointId
      type: System.String
      description: The point's id.
    return:
      type: System.Nullable{Direction}
      description: The point's facing, or null.
    content.vb: Public Shared Function FacingAt(pointId As String) As Direction?
