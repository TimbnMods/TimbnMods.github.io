  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The kinds of people the game itself placed in one of its life simulator groups, one entry per person, such as

    the villagers of the village day group. People a plugin added with Npcs.Spawn are left out.
  example:
  - >-
    <pre><code class="lang-csharp">foreach (var kind in TimbnNpcs.GroupMemberIds(TimbnGameIds.Groups.VillagersDayAll))
        Npcs.AddVillager(kind);</code></pre>
  syntax:
    content: public static IReadOnlyList<string> GroupMemberIds(string groupId)
    parameters:
    - id: groupId
      type: System.String
      description: The group's id, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Groups" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Collections.Generic.IReadOnlyList{System.String}
      description: Definition ids in id order, empty when the group is missing or empty, or at the main menu.
    content.vb: Public Shared Function GroupMemberIds(groupId As String) As IReadOnlyList(Of String)
