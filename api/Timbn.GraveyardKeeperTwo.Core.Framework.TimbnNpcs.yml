  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Whether a point is free for anyone, meaning it exists, is switched on, nobody claimed it and nobody stands on it.

    Use it to pick a point before you know who goes there. A person's own IsFree also counts their own claim as free.
  example: []
  syntax:
    content: public static bool IsFree(string pointId)
    parameters:
    - id: pointId
      type: System.String
      description: The point's id.
    return:
      type: System.Boolean
      description: False when the point is taken, missing or switched off, and at the main menu.
    content.vb: Public Shared Function IsFree(pointId As String) As Boolean
