  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Writes the game's text markup for you, for icons and other lines inside a line of text. Use it in any text a plugin

    adds, such as quest lines or Text.Add. Lang files write the same markup by hand.
  example:
  - >-
    <pre><code class="lang-csharp">$"Come back on {TimbnMarkup.Weekday(TimbnWeekday.Pride)} and bring 2 {TimbnMarkup.Icon("slv")}."

    $"Ask {TimbnMarkup.Localized(TimbnGameIds.Npcs.Herm)} about the gold wine."</code></pre>
  syntax:
    content: public static class TimbnMarkup
    content.vb: Public Module TimbnMarkup
