  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a line in the NPC's speech bubble with values filled into its text. The text holds the game's own

    placeholders <code>%1</code>, <code>%2</code> and so on, filled from <code class="paramref">values</code> in order. A value that is

    a <code>Func&lt;object&gt;</code> is worked out when the line is shown rather than when the talk is scripted, so it

    can reflect what an earlier step changed.
  example:
  - >-
    With the text <code>You owe me %1 coins, %2.</code>


    <pre><code class="lang-csharp">Func&lt;object&gt; price = () =&gt; CurrentPrice();

    talk.Say("larry_price", price, "friend");</code></pre>
  syntax:
    content: public TimbnConversation Say(string key, params object[] values)
    parameters:
    - id: key
      type: System.String
      description: The line's localisation key.
    - id: values
      type: System.Object[]
      description: The values for <code>%1</code>, <code>%2</code> and so on. A number is written the way the game writes numbers.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnConversation
      description: This conversation, for chaining.
    content.vb: Public Function Say(key As String, ParamArray values As Object()) As TimbnConversation
