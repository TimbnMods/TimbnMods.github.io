    startLine: 163
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a branch chosen by the game's state when the conversation reaches it, for example a different line

    when the player is carrying enough of something. The condition is checked at that point, not when the talk

    is scripted. The chosen branch plays, then the conversation carries on with whatever steps follow. A

    throw in the condition is logged and ends the conversation.
  example:
  - >-
    <pre><code class="lang-csharp">talk.When(
        () =&gt; MainGame.PlayerData.inventory.Data.GetTotalCountInInventory("grape_wine") &gt; 0,
        then =&gt; then.Say("larry_thanks_for_wine"),
        otherwise =&gt; otherwise.Say("larry_still_thirsty"));</code></pre>
  syntax:
    content: public TimbnConversation When(Func<bool> condition, Action<TimbnConversation> then, Action<TimbnConversation>? otherwise = null)
    parameters:
    - id: condition
      type: System.Func{System.Boolean}
      description: Whether the branch in <code class="paramref">then</code> should play.
    - id: then
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnConversation}
      description: Adds the steps that play when the condition is true.
    - id: otherwise
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnConversation}
      description: Adds the steps that play when it is false. Leave it out to play nothing.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnConversation
      description: This conversation, for chaining.
    content.vb: Public Function [When](condition As Func(Of Boolean), [then] As Action(Of TimbnConversation), otherwise As Action(Of TimbnConversation) = Nothing) As TimbnConversation
