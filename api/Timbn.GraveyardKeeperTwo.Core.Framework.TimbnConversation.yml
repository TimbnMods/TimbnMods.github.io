  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Shows answer choices over the player and waits for one to be picked. Follow it with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnConversation.If(System.String%2cSystem.Action%7bTimbn.GraveyardKeeperTwo.Core.Framework.TimbnConversation%7d)" data-throw-if-not-resolved="false"></xref> to

    say what each answer leads to. An answer that is a quest's FinishOnAnswer id shows the quest's price and

    reward, is greyed out until the player can pay, and hands the quest in when picked. Since the player

    cannot walk off, Core adds a "leave" answer that ends the conversation whenever every answer you give has

    a price, a need, or a reward, so a player who cannot pay is never stuck.
  example: []
  syntax:
    content: public TimbnConversation Ask(params TimbnAnswer[] answers)
    parameters:
    - id: answers
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnAnswer[]
      description: >-
        The answers, in the order they are shown. A plain localisation key is an answer with no extras, and

        <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnAnswer" data-throw-if-not-resolved="false"></xref> adds prices, needs, and rewards.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnConversation
      description: This conversation, for chaining.
