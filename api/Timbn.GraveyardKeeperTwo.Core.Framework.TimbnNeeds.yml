  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    What has to be true before the player can go on, checked but never taken. On an answer the game draws each need

    as a lock and grays the answer out until they are all met. On a quest or stage they gate its talk, so the NPC only

    offers it once they are met. To take something from the player, use <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCost" data-throw-if-not-resolved="false"></xref>.
  example:
  - <pre><code class="lang-csharp">.Needs(need =&gt; need.Reputation(30).OnWeekday(TimbnWeekday.Pride).Item("shovel"))</code></pre>
  syntax:
    content: public sealed class TimbnNeeds
    content.vb: Public NotInheritable Class TimbnNeeds
