  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a quest with its giver read from its run, like the Add that takes a name, with the name only in the plugin's

    lang files under the quest id. Pair it with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder.Description" data-throw-if-not-resolved="false"></xref>,

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTalk%601.Line(System.String%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref>, and the Accept and Decline that take no text, so all of the quest's text

    lives in lang/en.txt and its translations.
  example:
  - >-
    <pre><code class="lang-csharp">var craving = Quests.Add("my_craving", quest =&gt; quest
        .Repeatable()
        .Setup(run =&gt; ...)
        .Giver(run =&gt; run.NpcId("villager"))
        .Description()
        .Offer(talk =&gt; talk
            .Line("ask")
            .Accept(then =&gt; then.Line("thanks"))
            .Decline())
        .Cost((cost, run) =&gt; cost.Item(run.Item("dish")))
        .Talk(talk =&gt; talk
            .Accept(then =&gt; then.Line("thanks"))
            .Decline()));</code></pre>

    with lang/en.txt holding my_craving, quest_open_my_craving_d, my_craving_offer_ask, my_craving_accept,

    my_craving_accept_thanks, my_craving_decline, my_craving_talk_accept, my_craving_talk_accept_thanks and

    my_craving_talk_decline.
