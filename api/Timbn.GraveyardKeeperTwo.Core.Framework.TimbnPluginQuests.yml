  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a quest. Core registers it in the quest tree, adds its text, shows a speech bubble on the NPC

    when there is something to say, runs the offer and talk conversations, and pays its rewards. See <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder" data-throw-if-not-resolved="false"></xref> for what a quest can hold. Call it in OnAwake.
  example:
  - >-
    <pre><code class="lang-csharp">var wine = Quests.Add("my_larry_wine", TimbnGameIds.Npcs.Larry, "Larry's Thirst", quest =&gt; quest
        .Description("Larry wants 3 bottles of wine.")
        .Offer(talk =&gt; talk
            .Say("Could you fetch us 3 bottles of wine?")
            .Accept("Fine."))
        .Cost(cost =&gt; cost.Item("grape_wine:1", 3))
        .Reward(reward =&gt; reward.Money(300))
        .Talk(talk =&gt; talk.Accept("Here's your wine.", then =&gt; then.Say("Lovely."))));</code></pre>
  syntax:
    content: public TimbnQuest Add(string id, string npcId, string name, Action<TimbnQuestBuilder> quest)
    parameters:
    - id: id
      type: System.String
      description: The quest id. Keep it stable, since saves keep progress under it.
    - id: npcId
      type: System.String
      description: The NPC who gives the quest, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>, such as TimbnGameIds.Npcs.Larry.
    - id: name
      type: System.String
      description: The quest's name in the quest tree.
    - id: quest
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder}
      description: Describes the quest.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuest
      description: >-
        The quest, for starting it, marking it ready, or chaining another quest after it. It lives until the plugin

        unloads, since a quest in a loaded save should not vanish mid save. When another mod already adds a quest

        with the same id, this one is skipped and named in the main menu's load error popup.
    content.vb: Public Function Add(id As String, npcId As String, name As String, quest As Action(Of TimbnQuestBuilder)) As TimbnQuest
