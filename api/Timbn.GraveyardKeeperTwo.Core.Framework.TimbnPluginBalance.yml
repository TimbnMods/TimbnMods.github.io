    startLine: 82
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds an item copied from one of the game's, with its name and description in the loaded language and its own

    icon, in one call. Everything else, price, stack size and what using it does, stays the template's unless edit

    changes it. For example

    <code>Balance.AddItem("cook_baked_fish", "timbn_smoked_fish", "Smoked Fish", "Golden and smoky.", "timbn_smoked_fish")</code>

    is food that restores energy like baked fish. Core keeps the item out of every save the game writes.
  example:
  - >-
    A pie worth more than the muffin it is copied from, with its text in the lang files.


    <pre><code class="lang-csharp">Balance.AddItem("cook_muffin", "timbn_cheese_pie", "", "", "i_cheese_pie", pie =&gt; pie.basePrice = 40);</code></pre>
  syntax:
    content: public IDisposable AddItem(string templateItemId, string id, string name, string description, string iconId = "", Action<ItemDef>? edit = null)
    parameters:
    - id: templateItemId
      type: System.String
      description: The id of the game's item to copy.
    - id: id
      type: System.String
      description: The new item's id. It must not belong to an item the game ships.
    - id: name
      type: System.String
      description: The item's name. Empty leaves the text to the plugin's lang files.
    - id: description
      type: System.String
      description: The item's tooltip description. Empty leaves it to the lang files.
    - id: iconId
      type: System.String
      description: The item's icon, any sprite the game has or one added with Sprites.AddEmbeddedPng. Empty keeps the template's.
    - id: edit
      type: System.Action{ItemDef}
      description: >-
        Changes anything else on the copy, such as its price or onUseExpressions, each time the balance loads. Can be

        null. It runs after the icon is set, and the game reads the item's use effects again afterward.
    return:
      type: System.IDisposable
      description: A handle that removes the item early when disposed. You don't need to keep it.
    content.vb: Public Function AddItem(templateItemId As String, id As String, name As String, description As String, iconId As String = "", edit As Action(Of ItemDef) = Nothing) As IDisposable
