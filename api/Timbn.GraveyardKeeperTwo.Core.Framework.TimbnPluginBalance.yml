    id: Edit
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Balance/TimbnPluginBalance.cs
    startLine: 107
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Changes one of the game's own definitions, such as a perk, an item, or a craft, and puts it back when the

    plugin unloads or the returned handle is disposed. Apply runs straight away if the balance has loaded, and

    again on the fresh copy each time the balance loads after that, so the change is never lost to a reload.

    Revert only runs on the copy apply changed, and only while that copy is still the loaded one. Keep what

    revert needs, such as the old value, from inside apply. Pair it with Settings.While to follow a toggle.
  example:
  - >-
    Raise the red tech point cap while the setting is on.


    <pre><code class="lang-csharp">LazyExpression original = null!;

    Settings.While(PluginConfig.TechPointCap, cap =&gt; cap &gt; 999, () =&gt; Balance.Edit&lt;GameResSystemDef&gt;(
        "tech_red",
        resource =&gt; { original = resource.max; resource.max = new LazyExpression("5000"); },
        resource =&gt; resource.max = original));</code></pre>
  syntax:
    content: 'public IDisposable Edit<T>(string id, Action<T> apply, Action<T> revert) where T : BalanceBaseObject'
    parameters:
    - id: id
      type: System.String
      description: The definition's id.
    - id: apply
      type: System.Action{{T}}
      description: Makes the change. A throw is logged.
    - id: revert
      type: System.Action{{T}}
      description: Puts the definition back the way apply found it. A throw is logged.
    typeParameters:
    - id: T
      description: The definition's type, such as PerkDef, ItemDef, or CraftDef.
    return:
      type: System.IDisposable
      description: A handle that reverts the change early when disposed. You don't need to keep it.
    content.vb: Public Function Edit(Of T As BalanceBaseObject)(id As String, apply As Action(Of T), revert As Action(Of T)) As IDisposable
