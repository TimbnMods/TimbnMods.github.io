  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a definition to the balance. It goes in straight away if the balance has already loaded, and again

    every time the balance loads after that. Core keeps an added item, buff, craft or station out of every save the

    game writes, so the save still loads once the mod is gone. The game's lookups built from definitions follow

    along, so a build desk offers a new building and a station lists a new craft straight away, and a station

    already in the loaded save picks up a new or replaced world object definition.
  example: []
  syntax:
    content: public IDisposable Add(BalanceBaseObject definition)
    parameters:
    - id: definition
      type: LazyBearTechnology.BalanceBaseObject
      description: The definition to add. Its id must not belong to a definition the game ships.
    return:
      type: System.IDisposable
      description: A handle that removes the definition early when disposed. You don't need to keep it.
    content.vb: Public Function Add(definition As BalanceBaseObject) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginBalance.Add*
