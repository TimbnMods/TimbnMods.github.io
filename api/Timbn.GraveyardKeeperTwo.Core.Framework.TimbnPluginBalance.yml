  summary: >-
    Adds a definition like <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginBalance.Add(LazyBearTechnology.BalanceBaseObject)" data-throw-if-not-resolved="false"></xref>, and calls prepare with the loaded balance

    right before each insert. Use it when the definition needs something from the balance first, such as

    values copied from one of the game's items. If another plugin already holds the same id, this one

    replaces it in place, which is how a hot reloaded plugin takes over from its old copy.
  example: []
  syntax:
    content: public IDisposable Add(BalanceBaseObject definition, Action<GameBalance>? prepare)
    parameters:
    - id: definition
      type: LazyBearTechnology.BalanceBaseObject
      description: The definition to add. Its id must not belong to a definition the game ships.
    - id: prepare
      type: System.Action{GameBalance}
      description: Called with the loaded balance just before the definition goes in, on every load. Can be null.
    return:
      type: System.IDisposable
      description: A handle that removes the definition early when disposed. You don't need to keep it.
    content.vb: Public Function Add(definition As BalanceBaseObject, prepare As Action(Of GameBalance)) As IDisposable
