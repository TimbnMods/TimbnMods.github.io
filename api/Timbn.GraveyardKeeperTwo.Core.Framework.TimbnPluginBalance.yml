  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a copy of one of the game's definitions under a new id. Every field is copied from the game's definition

    each time the balance loads, then edit runs on the copy, so it starts with everything the game expects and you

    change only what differs. For example

    <code>Balance.AddCopy&lt;ItemDef&gt;("cook_baked_fish", "timbn_smoked_fish", fish =&gt; TimbnBalance.SetIcon(fish, "timbn_smoked_fish"))</code>.
  example: []
  syntax:
    content: 'public IDisposable AddCopy<T>(string templateId, string id, Action<T>? edit = null) where T : BalanceBaseObject, new()'
    parameters:
    - id: templateId
      type: System.String
      description: The id of the game's definition to copy.
    - id: id
      type: System.String
      description: The new definition's id. It must not belong to a definition the game ships.
    - id: edit
      type: System.Action{{T}}
      description: >-
        Changes the copy after its fields are filled in. Can be null. The game reads an item's use effects again

        afterward, so a change to onUseExpressions shows.
    typeParameters:
    - id: T
      description: The kind of definition, such as ItemDef, CraftDef, WGODef or BuildingDef.
    return:
      type: System.IDisposable
      description: A handle that removes the definition early when disposed. You don't need to keep it.
    content.vb: Public Function AddCopy(Of T As {BalanceBaseObject, New})(templateId As String, id As String, edit As Action(Of T) = Nothing) As IDisposable
