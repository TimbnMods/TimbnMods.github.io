  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Shows a popup with an OK button in the game's dialog window the next time the main menu is on screen, or

    right away if it already is. Each popup shows once, and several queue up one after another.
  example: []
  syntax:
    content: public IDisposable AddPopup(string header, string text)
    parameters:
    - id: header
      type: System.String
      description: The window title. The game logs an error when it is empty.
    - id: text
      type: System.String
      description: The message.
    return:
      type: System.IDisposable
      description: A handle that cancels the popup if it has not shown yet. You don't need to keep it.
    content.vb: Public Function AddPopup(header As String, text As String) As IDisposable
