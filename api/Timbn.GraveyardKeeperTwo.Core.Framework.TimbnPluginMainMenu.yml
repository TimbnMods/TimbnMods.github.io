  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Puts a plugin's messages on the main menu using the game's own UI, either as a line of text above the

    game's credits or as a popup in the game's dialog window. Lines are removed when the plugin unloads.

    Every Timbn plugin that starts already gets a line with its name and version, so this is for anything

    beyond that. Reach it through the plugin's MainMenu property.
