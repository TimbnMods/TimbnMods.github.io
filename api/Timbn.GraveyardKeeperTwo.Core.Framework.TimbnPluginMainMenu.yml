  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a line to the list of Timbn mods above the main menu's "game by" credit, drawn like the game's own

    "published by: tinyBuild". Lines are listed in the order they were added, and show only on the main

    menu, never in game.
  example: []
  syntax:
    content: public IDisposable AddLine(string label, string value)
    parameters:
    - id: label
      type: System.String
      description: 'The plain part, for example "Vanilla Tweaks: ".'
    - id: value
      type: System.String
      description: The highlighted part, for example "1.1.0".
    return:
      type: System.IDisposable
      description: A handle that removes the line early when disposed. You don't need to keep it.
    content.vb: Public Function AddLine(label As String, value As String) As IDisposable
