  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    A quest added with the plugin's Quests.Add, all its stages included. Keep it to start the quest, mark it ready or

    complete it from your own code, and pass it to another quest's OfferAfter or ContinuesFrom to chain them.
  example:
  - >-
    <pre><code class="lang-csharp">var bats = Quests.Add("my_cellar_bats", TimbnGameIds.Npcs.Larry, "Bats in the Cellar", quest =&gt; quest
        .Description("Smoke the bats out of the cellar.")
        .ReadyByCode());

    Events.PlayerItemUsed(item =&gt; { if (item.id == "smoke_bomb") bats.MarkReady(); });</code></pre>
  syntax:
    content: public sealed class TimbnQuest
    content.vb: Public NotInheritable Class TimbnQuest
