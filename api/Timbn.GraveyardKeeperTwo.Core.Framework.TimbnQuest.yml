      path: src/Timbn.GraveyardKeeperTwo.Core/Quests/TimbnQuest.cs
      branch: core/2/main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: NewRun
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Quests/TimbnQuest.cs
    startLine: 54
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Rolls a new run of a quest with a Setup, such as on a lucky new day. Setup fills it, then the giver offers the

    quest, or it starts straight away when it has no Offer or StartsOn. It does nothing while a run is going, while

    the quest is in progress or done, or until OfferAfter and OfferWhen allow it.
  example:
  - >-
    <pre><code class="lang-csharp">Events.NewDayStarted(_ =&gt;

    {
        if (UnityEngine.Random.Range(0, 7) == 0)
            craving.NewRun();
    });</code></pre>
  syntax:
    content: public bool NewRun()
    return:
      type: System.Boolean
      description: True when a run was rolled.
    content.vb: Public Function NewRun() As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuest.NewRun*
