      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: ShowWhen
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Stations/TimbnStationBuilder.cs
    startLine: 268
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a model to the station's front facing that shows while a condition holds and goes away when it doesn't, the

    way the game's autopsy table shows a cloth over a body. The game checks the condition again when the station's

    items, resources, worker or work change, and when the station loads, so it needs nothing from the mod. The model

    lines up with the station's own when both are built from faces, whatever their sizes. It adds no footprint,

    body or dock, so it can't change where the station stands or where a zombie works it.
  example:
  - >-
    A slab that shows a zombie lying on it while one is seated, instead of the empty stone.


    <pre><code class="lang-csharp">station
        .Model(emptySlab)
        .ShowWhen(TimbnLook.HasWorker(), slabWithZombie, replacesBase: true);</code></pre>
  syntax:
    content: public TimbnStationBuilder ShowWhen(TimbnLookCondition condition, TimbnModel model, bool replacesBase = false)
    parameters:
    - id: condition
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLookCondition
      description: When the model shows, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLook" data-throw-if-not-resolved="false"></xref>.
    - id: model
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel
      description: The model to show.
    - id: replacesBase
      type: System.Boolean
      description: True to hide the station's own model while this one shows, for a full swap of the look.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder
    content.vb: Public Function ShowWhen(condition As TimbnLookCondition, model As TimbnModel, replacesBase As Boolean = False) As TimbnStationBuilder
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.ShowWhen*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The condition or the model is null.
  nameWithType.vb: TimbnStationBuilder.ShowWhen(TimbnLookCondition, TimbnModel, Boolean)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.ShowWhen(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLookCondition, Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel, Boolean)
