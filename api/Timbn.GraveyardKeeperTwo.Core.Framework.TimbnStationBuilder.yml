  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Describes a buildable workstation for the plugin's Stations.Add, with its look, which game station it behaves

    like, and what it costs at the build desk. Core turns it into the five definitions the game expects, the station,

    its construction site, the build desk entry and the two removals, with their text, the same way the game's own

    woodworking bench is set up. Only <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Model(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel)" data-throw-if-not-resolved="false"></xref> is required. A station with no <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Cost(System.ValueTuple%7bSystem.String%2cSystem.Int32%7d%5b%5d)" data-throw-if-not-resolved="false"></xref> is free, and

    one with no <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.UnlockedBy(System.String)" data-throw-if-not-resolved="false"></xref> is on the build desk from the start.
  example:
  - >-
    A smoking rack that works like the kitchen oven, built in the yard for 4 boards.


    <pre><code class="lang-csharp">var model = Models.Build("SmokingRack", faces =&gt; faces.Block("smoking_rack", x: 0, y: 0, z: 0, depth: 30));

    var rack = Stations.Add("timbn_smoking_rack", "Smoking Rack", "A plain rack for smoking fish.", station =&gt; station
        .Model(model, model.Size)
        .BasedOn("kitchen_oven")
        .Icon("timbn_red_workbench")
        .Cost(("flitch", 4))
        .NoFuel()
        .NoExtensions());</code></pre>
