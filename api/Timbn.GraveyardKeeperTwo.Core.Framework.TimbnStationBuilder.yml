  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Slot(System.String,UnityEngine.Vector3,UnityEngine.Vector3)
  id: Slot(System.String,UnityEngine.Vector3,UnityEngine.Vector3)
