  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Lets the player lay a zombie on the station and take it back, the way the game's corpse pallet holds a corpse. E

    with a zombie overhead puts it in the station's one slot, where it stops being drawn, and E with free hands takes

    it back unless a craft is running there, so a craft started on the station holds the zombie until it ends. The

    station can't be dismantled while a zombie lies on it. Show the zombie with

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.ShowWhen(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLookCondition%2cTimbn.GraveyardKeeperTwo.Core.Framework.TimbnModel%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> and <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLook.HoldsGroup(System.String%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>("zombie"),

    and start a craft there with the plugin's Crafts.Start. The game's resurrection table ("resurrection_table_1")

    makes a good base.
  example: []
  syntax:
    content: public TimbnStationBuilder HoldsZombie()
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder
    content.vb: Public Function HoldsZombie() As TimbnStationBuilder
