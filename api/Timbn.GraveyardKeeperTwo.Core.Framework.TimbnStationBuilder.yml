  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Stations/TimbnStationBuilder.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: Slot
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Stations/TimbnStationBuilder.cs
    startLine: 311
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Builds a slot into the station's front facing, a spot where a station or extension that calls BuildsInSlot with

    the same id goes, the way the game's conveyor furnace has spots for its bellows and press. In build mode the game

    marks each free slot in green, places it only there, and links the two, so the station finds

    what sits in its slots with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnWorld.Extensions(WgoData)" data-throw-if-not-resolved="false"></xref>. Removing the station removes what sits in its

    slots, with their refund and anything they hold dropped on the ground. A slot is the size of what goes in it, so

    pass the same size given to that one's Model. The game snaps both to its build grid, so the size has to be whole

    cells (0.32 across and 0.3 deep) and the slot's corner a whole number of cells from the corner of this station's

    footprint, and Stations.Add says the nearest spot that fits when it isn't. A slot can sit beside the station, the

    way the yard furnace takes its bellows, or inside its footprint, the way the conveyor furnace takes its pieces on top.
  example:
  - >-
    A table with a stand's slot on its left and another on its right.


    <pre><code class="lang-csharp">station
        .Model(table, new Vector3(1.28f, 0.8f, 0.6f))
        .Slot("timbn_stand_slot", new Vector3(-0.96f, 0f, 0f), new Vector3(0.64f, 1f, 0.6f))
        .Slot("timbn_stand_slot", new Vector3(0.96f, 0f, 0f), new Vector3(0.64f, 1f, 0.6f));</code></pre>
  syntax:
    content: public TimbnStationBuilder Slot(string slotId, Vector3 position, Vector3 size)
    parameters:
    - id: slotId
      type: System.String
      description: The slot's id, which the station or extension that goes in it names.
    - id: position
      type: UnityEngine.Vector3
      description: Where the center of what goes in the slot sits, from the center of this station on the ground. The height is ignored.
    - id: size
      type: UnityEngine.Vector3
      description: The size of what goes in the slot. The height is ignored.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder
    content.vb: Public Function Slot(slotId As String, position As Vector3, size As Vector3) As TimbnStationBuilder
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Slot*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The id is empty.
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: The width or depth is zero or below.
  nameWithType.vb: TimbnStationBuilder.Slot(String, Vector3, Vector3)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Slot(String, UnityEngine.Vector3, UnityEngine.Vector3)
  name.vb: Slot(String, Vector3, Vector3)
