    items drop. A station with only this side stays as it is placed. Add <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Left(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel%2cTimbn.GraveyardKeeperTwo.Core.Framework.TimbnModel)" data-throw-if-not-resolved="false"></xref>, <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Right(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel%2cTimbn.GraveyardKeeperTwo.Core.Framework.TimbnModel)" data-throw-if-not-resolved="false"></xref> or

