    id: GameHasControl
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPlayer.cs
    startLine: 27
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Whether the game itself has taken the player's control, such as for a cutscene, sleep, or a teleport.

    Control taken by mods with the plugin's Player.TakeControl does not count, so a mod holding the player can

    use it to notice the game stepping in.
  example:
  - >-
    Stop meditating when the game takes control for anything but an open window.


    <pre><code class="lang-csharp">if (TimbnPlayer.GameHasControl(TakenControlType.ByUI))
        meditation.Stop();</code></pre>
  syntax:
    content: public static bool GameHasControl(params TakenControlType[] ignored)
    parameters:
    - id: ignored
      type: TakenControlType[]
      description: The game's reasons that should not count, such as TakenControlType.ByUI for open windows.
    return:
      type: System.Boolean
      description: True when the game has taken control for any other reason. False at the main menu.
    content.vb: Public Shared Function GameHasControl(ParamArray ignored As TakenControlType()) As Boolean
