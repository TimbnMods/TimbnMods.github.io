  - <pre><code class="lang-csharp">TimbnPlayer.AddResource("insanity", -10f);</code></pre>
  syntax:
    content: public static bool AddResource(string id, float amount)
    parameters:
    - id: id
      type: System.String
      description: The resource's id, such as insanity.
    - id: amount
      type: System.Single
      description: How much to add. Negative takes.
    return:
      type: System.Boolean
      description: False at the main menu, when there is no player.
