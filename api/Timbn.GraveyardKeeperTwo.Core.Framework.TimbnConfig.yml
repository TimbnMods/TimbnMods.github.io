  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Binds a setting that stays out of the in game configuration manager, for a switch only a developer needs, such as

    turning on a plugin's debug log. It is still written to the config file and read like any other entry.
  example:
  - <pre><code class="lang-csharp">WriteDebugLog = config.BindHidden("Debug", "WriteDebugLog", false, "Writes the debug log.");</code></pre>
  syntax:
    content: public static ConfigEntry<T> BindHidden<T>(this ConfigFile config, string section, string key, T defaultValue, string description)
    parameters:
    - id: config
      type: BepInEx.Configuration.ConfigFile
      description: The plugin's config file.
    - id: section
      type: System.String
      description: The section it goes under.
    - id: key
      type: System.String
      description: The setting's name.
    - id: defaultValue
      type: '{T}'
      description: The value until it is changed.
    - id: description
      type: System.String
      description: What the setting does.
    typeParameters:
    - id: T
    return:
      type: BepInEx.Configuration.ConfigEntry{{T}}
      description: The bound setting.
    content.vb: Public Shared Function BindHidden(Of T)(config As ConfigFile, section As String, key As String, defaultValue As T, description As String) As ConfigEntry(Of T)
