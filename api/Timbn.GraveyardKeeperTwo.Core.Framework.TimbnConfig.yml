  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Binds a setting that only accepts values between a lowest and a highest, which a config manager shows as a

    slider. It is the same as ConfigFile.Bind with an AcceptableValueRange, in one line.
  example:
  - <pre><code class="lang-csharp">TimeSpeed = config.BindRange("Meditation", "TimeSpeed", 7f, "How many times faster time runs while you meditate.", 1f, 50f);</code></pre>
  syntax:
    content: 'public static ConfigEntry<T> BindRange<T>(this ConfigFile config, string section, string key, T defaultValue, string description, T min, T max) where T : IComparable'
    parameters:
    - id: config
      type: BepInEx.Configuration.ConfigFile
      description: The plugin's config file.
    - id: section
      type: System.String
      description: The section it goes under.
    - id: key
      type: System.String
      description: The setting's name.
    - id: defaultValue
      type: '{T}'
      description: The value until the player changes it.
    - id: description
      type: System.String
      description: What the setting does, shown to players.
    - id: min
      type: '{T}'
      description: The lowest value allowed.
    - id: max
      type: '{T}'
      description: The highest value allowed.
    typeParameters:
    - id: T
    return:
      type: BepInEx.Configuration.ConfigEntry{{T}}
      description: The bound setting.
    content.vb: Public Shared Function BindRange(Of T As IComparable)(config As ConfigFile, section As String, key As String, defaultValue As T, description As String, min As T, max As T) As ConfigEntry(Of T)
