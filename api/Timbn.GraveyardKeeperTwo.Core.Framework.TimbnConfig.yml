    startLine: 29
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Moves the values of config entries a plugin has renamed or moved into their new entries, so players keep

    their settings across the change. Call it at the end of <code>BindConfig</code>, once every new entry is bound.

    An old entry is only used while it is still in the file, and it is removed from the file afterwards.
  example:
  - >-
    <pre><code class="lang-csharp">TimbnConfig.CarryOver(
        config,
        (StuckCarriers, "Carriers", "ShowWhenStuck"),
        (UnstuckKey, "Unstuck", "Key"));</code></pre>
  syntax:
    content: public static void CarryOver(ConfigFile config, params (ConfigEntryBase Entry, string Section, string Key)[] moves)
    parameters:
    - id: config
      type: BepInEx.Configuration.ConfigFile
      description: The plugin's config file.
    - id: moves
      type: System.ValueTuple{BepInEx.Configuration.ConfigEntryBase,System.String,System.String}[]
      description: Each new entry with the section and key it used to have.
    content.vb: Public Shared Sub CarryOver(config As ConfigFile, ParamArray moves As (Entry As ConfigEntryBase, Section As String, Key As String)())
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnConfig.CarryOver*
