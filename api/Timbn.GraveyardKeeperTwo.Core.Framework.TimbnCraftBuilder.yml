    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Crafts/TimbnCraftBuilder.cs
    startLine: 272
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Lets the craft start at a station only while the check passes for that station, for a condition the game has no

    field for. Until it passes the craft window's Start button stays gray and a queued craft waits, the way they do

    for a missing ingredient, and a craft already running carries on. The game asks again whenever it looks at the

    craft, so keep the check quick. A second call adds another check that must pass too. A check that throws is

    logged once and counts as passing. The check is undone when the plugin unloads.
  example:
  - >-
    A lesson that only starts while a stand in the machine's slots holds a zombie.


    <pre><code class="lang-csharp">Crafts.Add("timbn_lesson", "Lesson", "Teaches the zombies on the stands.", craft =&gt; craft
        .In(machine)
        .Requires(station =&gt; TimbnWorld.Extensions(station).Any(stand =&gt; TimbnZombies.AtStation(stand) != null)));</code></pre>
  syntax:
    content: public TimbnCraftBuilder Requires(Func<WgoData, bool> check)
    parameters:
    - id: check
      type: System.Func{WgoData,System.Boolean}
      description: Told the station the craft would start at, and returns whether it may.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder
    content.vb: Public Function Requires(check As Func(Of WgoData, Boolean)) As TimbnCraftBuilder
