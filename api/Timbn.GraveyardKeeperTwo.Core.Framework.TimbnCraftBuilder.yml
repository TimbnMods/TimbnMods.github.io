    id: TimbnCraftBuilder
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Crafts/TimbnCraftBuilder.cs
    startLine: 25
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Describes a craft for the plugin's Crafts.Add, with where it runs, what it takes in and what it makes. The craft is

    copied from one of the game's own, the woodworking bench's wooden plank unless <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder.BasedOn(System.String)" data-throw-if-not-resolved="false"></xref> names another, so it

    starts with everything the game expects and the builder changes only what differs. What is not set stays the

    template's, so a craft that only calls <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder.Needs(System.String%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> and <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder.Makes(System.String%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> keeps the template's

    station, work time and energy. The one exception is the unlock, since a craft is open from the start whatever the

    template did unless <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder.NeedsUnlock" data-throw-if-not-resolved="false"></xref> or <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder.UnlockedBy(System.String)" data-throw-if-not-resolved="false"></xref> is called.
  example:
  - >-
    Four sticks from a board at the Stick Box, and a plank from sticks that needs the pillar next to it.


    <pre><code class="lang-csharp">Crafts.Add("timbn_stick_box_sticks", "Sticks from a Board", "Split one board into 4 sticks.", craft =&gt; craft
        .In(box)
        .Needs("flitch")
        .Makes("stick", 4));

    Crafts.Add("timbn_stick_box_magic_plank", "Plank from Sticks", "The red pillar binds 4 sticks back into a plank.", craft =&gt; craft
        .In(box)
        .NeedsExtension("timbn_red_magic")
        .Needs("stick", 4)
        .Makes("wooden_plank"));</code></pre>
  syntax:
    content: public sealed class TimbnCraftBuilder
