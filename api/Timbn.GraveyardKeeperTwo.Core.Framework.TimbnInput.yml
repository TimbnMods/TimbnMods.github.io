  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    True when <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.HotkeysEnabled" data-throw-if-not-resolved="false"></xref> is and the player can also move and act. The game takes control away

    during dialog, cutscenes, sleep, teleports, fishing, building, ladders, work at a station, and attacks, and

    its own input code checks <code>PlayerController.IsControlsEnabled</code> the same way. Use it for a hotkey that

    acts on the world, such as spawning an item at the player.
