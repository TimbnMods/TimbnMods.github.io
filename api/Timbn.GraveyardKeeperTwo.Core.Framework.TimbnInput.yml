- uid: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.IsDownIgnoringOtherKeys(BepInEx.Configuration.KeyboardShortcut)
  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.IsDownIgnoringOtherKeys(BepInEx.Configuration.KeyboardShortcut)
  id: IsDownIgnoringOtherKeys(BepInEx.Configuration.KeyboardShortcut)
