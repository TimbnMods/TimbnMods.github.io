  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Tells a mod's hotkeys when the game would take the same key press itself, so a mod key does not fire behind an

    open window or in the middle of a cutscene. Use it in place of checking <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGame.IsInGame" data-throw-if-not-resolved="false"></xref> and

    <code>LazyWindowsStackController.ActiveWindow</code> by hand.
