    startLine: 83
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Whether one of the game's own keys, such as Interaction, was pressed this frame while <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.HotkeysEnabled" data-throw-if-not-resolved="false"></xref>

    holds. It reads the key however the player has bound it, on a keyboard or a gamepad. Pair it with a

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInteractionHint" data-throw-if-not-resolved="false"></xref> showing that key, so the game leaves the press to the mod.
  example:
  - >-
    <pre><code class="lang-csharp">_hint.Show(fire, LLBase.L("my_mod_meditate"));

    if (GameKey.Interaction.IsDownInGame())
        SitDown();</code></pre>
  syntax:
