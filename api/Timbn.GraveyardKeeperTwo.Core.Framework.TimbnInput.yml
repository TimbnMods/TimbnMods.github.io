  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnInput.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: IsDownIgnoringOtherKeys
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnInput.cs
    startLine: 101
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Whether <code class="paramref">shortcut</code> was pressed this frame, even while other keys are held. BepInEx's own

    IsDown says no whenever any key beyond the shortcut is down, so a key that has to work while the player walks,

    such as a jump, reads it with this instead. It does not check whether the game is reading input, so pair it

    with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.HotkeysEnabled" data-throw-if-not-resolved="false"></xref> or <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.PlayerHasControl" data-throw-if-not-resolved="false"></xref> as the key needs.
  example:
  - >-
    <pre><code class="lang-csharp">if (TimbnInput.PlayerHasControl &amp;&amp; PluginConfig.Jump.Value.IsDownIgnoringOtherKeys())
        jump.Start();</code></pre>
  syntax:
    content: public static bool IsDownIgnoringOtherKeys(this KeyboardShortcut shortcut)
    parameters:
    - id: shortcut
      type: BepInEx.Configuration.KeyboardShortcut
    return:
      type: System.Boolean
    content.vb: Public Shared Function IsDownIgnoringOtherKeys(shortcut As KeyboardShortcut) As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.IsDownIgnoringOtherKeys*
