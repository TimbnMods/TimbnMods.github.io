  summary: >-
    When one of a station's extra models shows, for <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.ShowWhen(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLookCondition%2cTimbn.GraveyardKeeperTwo.Core.Framework.TimbnModel%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>.

