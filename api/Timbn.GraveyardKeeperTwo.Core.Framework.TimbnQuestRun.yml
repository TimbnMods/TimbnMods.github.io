  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Sets a text value, the localization key of a line that shows in place of {name}, so one quest can say a

    different thing on each run, such as an answer that names what the player brings. Add the line with Text.Add or

    a lang file, and a translation of it shows in its place.
  example:
  - >-
    <pre><code class="lang-csharp">Text.Add("my_errand_potion", "I have some medication for you.");

    ...

    .Setup(run =&gt; { run.Text("delivering", "my_errand_potion"); return true; })

    .Talk(talk =&gt; talk.Accept("{delivering}"))</code></pre>
  syntax:
    content: public TimbnQuestRun Text(string name, string key)
    parameters:
    - id: name
      type: System.String
      description: A short name of lowercase letters, digits and underscores, starting with a letter.
    - id: key
      type: System.String
      description: The line's localization key.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestRun
      description: This run, for chaining.
    content.vb: Public Function Text(name As String, key As String) As TimbnQuestRun
