  summary: >-
    Holds a plugin's own data for the loaded save. Core fills <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnData%601.Current" data-throw-if-not-resolved="false"></xref> when a save loads

    and writes it to disk each time the game saves, so the plugin only reads and changes it. Get one from

    Saves.Register.
