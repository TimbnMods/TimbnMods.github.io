  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a PNG embedded in the plugin's DLL, like <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginSprites.AddPng(System.String%2cSystem.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref>. The resource is found by the sprite name

    plus ".png", so embed icons with <code>LogicalName="%(Filename)%(Extension)"</code>.
  example: []
  syntax:
    content: public IDisposable AddEmbeddedPng(string name)
    parameters:
    - id: name
      type: System.String
      description: The sprite name and the resource's name without ".png", for example "timbn_smoked_fish".
    return:
      type: System.IDisposable
      description: A handle that removes the sprite early when disposed. You don't need to keep it.
    content.vb: Public Function AddEmbeddedPng(name As String) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginSprites.AddEmbeddedPng*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: The plugin has no such embedded resource.
