  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a PNG under a sprite name. An image smaller than 48 pixels (the size of the game's icons) is centered

    on a 48 pixel canvas. Sprites use point filtering and 50 pixels per unit, like the game's own art.
  example: []
  syntax:
    content: public IDisposable AddPng(string name, byte[] png)
    parameters:
    - id: name
      type: System.String
      description: The sprite name, used as an item's or buff's IconId.
    - id: png
      type: System.Byte[]
      description: The PNG file's bytes, usually read from a resource embedded in the plugin's DLL.
    return:
      type: System.IDisposable
      description: A handle that removes the sprite early when disposed. You don't need to keep it.
    content.vb: Public Function AddPng(name As String, png As Byte()) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginSprites.AddPng*
