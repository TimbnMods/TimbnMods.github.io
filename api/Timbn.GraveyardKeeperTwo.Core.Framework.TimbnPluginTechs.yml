  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds technologies to the game's tech tree on behalf of a plugin, bought with tech points like the game's own and

    removed when the plugin unloads. Reach it through the plugin's Techs property. A save that bought one keeps

    working once the plugin is gone, since the game drops tech ids it doesn't know when it loads.
