  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a technology to the tech tree. Call it in OnAwake before the stations and crafts that name it in their

    UnlockedBy, so they find it. See <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTechBuilder" data-throw-if-not-resolved="false"></xref> for what a tech holds.
  example: []
  syntax:
    content: public IDisposable Add(string id, string name, Action<TimbnTechBuilder> tech)
    parameters:
    - id: id
      type: System.String
      description: The tech's id, for example "timbn_infusion_rack". Keep it stable, since saves name a bought tech by it.
    - id: name
      type: System.String
      description: The name shown on the tree. Empty leaves the text to the plugin's lang files under the id.
    - id: tech
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTechBuilder}
      description: Describes the tech.
    return:
      type: System.IDisposable
      description: A handle that removes the tech early when disposed. You don't need to keep it.
    content.vb: Public Function Add(id As String, name As String, tech As Action(Of TimbnTechBuilder)) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginTechs.Add*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The id is empty.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: The tech has no cell or no tech before it.
