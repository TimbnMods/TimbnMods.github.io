  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    A list of things for a person to do in order. Build one in a block's Intro, LateIntro or Loop, return one from

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps.Decide(System.Func%7bTimbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc%2cTimbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps%7d)" data-throw-if-not-resolved="false"></xref> to pick a trip, or hand one to <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc.RunSteps(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps%2cSystem.Action)" data-throw-if-not-resolved="false"></xref> to play it on command. A wait names

    its clock, game minutes that follow the game's speed or real seconds that do not.
  example:
  - >-
    <pre><code class="lang-csharp">steps
        .WalkNavmesh("npc_sim_village_right_side_road_34")
        .Walk("npc_sim_village_right_side_03")
        .WaitGameMinutes(45)
        .Walk("npc_sim_village_right_side_road_34")
        .WalkNavmesh("RT_herm_spawn");</code></pre>
