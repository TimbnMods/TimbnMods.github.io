  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Walks in straight lines from corner to corner as one movement, turning at each corner without stopping, for a

    route with several bends such as a way along the graveyard paths. The person ends within 0.1 of the last corner,

    the game's own slack for a waypoint walk, so take an exact step onto a seat or a spot with

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps.WalkStraight(System.Single%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> after it. Should the game's walker change, each corner is walked as

    its own straight step instead.
  example: []
  syntax:
    content: public TimbnNpcSteps WalkStraight(IReadOnlyList<Vector3> corners)
    parameters:
    - id: corners
      type: System.Collections.Generic.IReadOnlyList{UnityEngine.Vector3}
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps
    content.vb: Public Function WalkStraight(corners As IReadOnlyList(Of Vector3)) As TimbnNpcSteps
