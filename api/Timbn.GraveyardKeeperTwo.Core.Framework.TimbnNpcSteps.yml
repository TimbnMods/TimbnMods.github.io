    startLine: 144
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Picks a trip off the origin and runs it, then asks again from where it ended, so trips can chain on without

    going back to the origin in between. The pick is called with no previous trip at the origin, and with the trip

    just finished after its body. Return a trip to run it (only its Leave part is skipped when it chains on), or

    null to stay put at the origin or to run the finished trip's Return. Once the next block is due no trip chains

    on, and the block waits for the walk home. A point claimed on the way is let go when the chain is over.
  example:
  - >-
    <pre><code class="lang-csharp">.Loop(steps =&gt; steps
        .WaitGameMinutes(10, 30)
        .ChainTrips((npc, previous) =&gt; previous == null || Roll() &lt; 0.4 ? PickTrip(npc) : null))</code></pre>
  syntax:
    content: public TimbnNpcSteps ChainTrips(Func<TimbnNpc, TimbnNpcTrip?, TimbnNpcTrip?> pick)
    parameters:
    - id: pick
      type: System.Func{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc,Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcTrip,Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcTrip}
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps
    content.vb: Public Function ChainTrips(pick As Func(Of TimbnNpc, TimbnNpcTrip, TimbnNpcTrip)) As TimbnNpcSteps
