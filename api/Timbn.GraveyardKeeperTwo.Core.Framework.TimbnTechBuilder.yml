  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The spot the tech sits at. The game puts the tech at that column and row of the tab and never moves anything

    over for it, so pick a spot nothing else uses. Every vanilla tab is five rows tall (row 0 to 4), and columns can

    grow as far right as needed. Half steps work too, the way the game's Graveyard Path and Fence I sits at row 0.5.
  example: []
  syntax:
    content: public TimbnTechBuilder At(float column, float row)
    parameters:
    - id: column
      type: System.Single
      description: The column, counted from the left (posX).
    - id: row
      type: System.Single
      description: The row, counted from the bottom, so a bigger row is higher on the tree (posY).
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTechBuilder
    content.vb: Public Function At(column As Single, row As Single) As TimbnTechBuilder
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTechBuilder.At*
