    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Techs/TimbnTechBuilder.cs
    startLine: 17
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Describes a technology for the plugin's Techs.Add, a node on the game's tech tree that the player buys with tech

    points. It needs <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTechBuilder.At(System.Single%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> for its cell and <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTechBuilder.After(System.String%2cSystem.String%5b%5d)" data-throw-if-not-resolved="false"></xref> for the tech that comes before it. What the

    tech unlocks is set from the other side, by the station's or craft's UnlockedBy with this tech's id.
  example:
  - >-
    A tech on the anatomy tab, straight after Body Places II.


    <pre><code class="lang-csharp">Techs.Add("timbn_infusion_rack", "Infusion Rack", tech =&gt; tech
        .Tab(TechTreeTab.Anatomy)
        .At(8, 2)
        .After(TimbnGameIds.Techs.BodyPlaces2)
        .Cost(red: 50, green: 50, blue: 20));</code></pre>
  syntax:
    content: public sealed class TimbnTechBuilder
    content.vb: Public NotInheritable Class TimbnTechBuilder
