    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Quests/TimbnQuestStage.cs
    startLine: 27
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Which of the game's five rings the quest's node in the quest tree shows while the quest is in progress, the way

    the game sets one for each of its own quests. The green grows further around with each ring, and a completed

    quest always shows the gold laurel. Left out, a step of a ContinuesFrom chain gets a ring by its place in the chain,

    growing as the story goes on like the game's own storylines, and a quest on its own shows the first ring.
  example: []
  syntax:
    content: public TimbnQuestStage Phase(int phase)
    parameters:
    - id: phase
      type: System.Int32
      description: The ring, 1 to 5.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestStage
      description: This builder, for chaining.
    content.vb: Public Function Phase(phase As Integer) As TimbnQuestStage
