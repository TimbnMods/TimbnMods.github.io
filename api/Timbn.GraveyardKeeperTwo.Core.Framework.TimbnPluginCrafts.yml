  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a craft. See <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder" data-throw-if-not-resolved="false"></xref> for what it can hold. The craft window titles the craft with the

    name and shows the description in its tooltip. Call it in OnAwake, after the station it runs at when that is a

    station of the plugin's own.
  example:
  - >-
    Smoked fish from a river fillet and a log at the smoking rack, copied from the oven's baked fish.


    <pre><code class="lang-csharp">Crafts.Add("timbn_smoke_fillet_fish_river", "Smoked Fish", "A fish fillet and a log of firewood make one smoked fish.", craft =&gt; craft
        .In(rack)
        .BasedOn("cook_baked_fish")
        .Needs(("fillet_fish_river", 1), ("firewood", 1))
        .Makes("timbn_smoked_fish")
        .AutoFinish());</code></pre>
  syntax:
    content: public IDisposable Add(string id, string name, string description, Action<TimbnCraftBuilder> craft)
    parameters:
    - id: id
      type: System.String
      description: The craft's id, for example "timbn_smoke_fillet_fish_river". Keep it stable, since a save keeps a queued craft under it.
    - id: name
      type: System.String
      description: The name shown in the craft window. Empty leaves the text to the plugin's lang files.
    - id: description
      type: System.String
      description: The description shown in the craft's tooltip. Empty leaves it to the lang files.
    - id: craft
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder}
      description: Describes the craft.
    return:
      type: System.IDisposable
      description: A handle that removes the craft early when disposed. You don't need to keep it.
    content.vb: Public Function Add(id As String, name As String, description As String, craft As Action(Of TimbnCraftBuilder)) As IDisposable
