  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Starts a craft at a station from code, with no craft window, the way the game's own StartCraft expression puts

    the berries on a bush. The craft goes in the station's queue and runs like one the player started, so a station

    that already runs one starts it after. End it early with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginCrafts.Finish(WgoData)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public bool Start(WgoData station, string craftId)
    parameters:
    - id: station
      type: WgoData
      description: The station, for example one found with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnWorld.FindAll(System.String)" data-throw-if-not-resolved="false"></xref>.
    - id: craftId
      type: System.String
      description: The craft's id. It has to be one made at that station.
    return:
      type: System.Boolean
      description: False when the game has no such craft.
    content.vb: Public Function Start(station As WgoData, craftId As String) As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginCrafts.Start*
