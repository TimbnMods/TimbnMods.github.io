  summary: >-
    Adds a craft whose name and description come from the plugin's lang files, under the craft's id and id_d. See

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginCrafts.Add(System.String%2cSystem.String%2cSystem.String%2cSystem.Action%7bTimbn.GraveyardKeeperTwo.Core.Framework.TimbnCraftBuilder%7d)" data-throw-if-not-resolved="false"></xref>.
