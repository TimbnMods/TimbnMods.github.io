        .In(rack)
        .BasedOn("cook_baked_fish")
        .Needs(("fillet_fish_river", 1), ("firewood", 1))
        .Makes("timbn_smoked_fish"));</code></pre>

    with lang/en.txt holding timbn_smoke_fillet_fish_river and timbn_smoke_fillet_fish_river_d.
