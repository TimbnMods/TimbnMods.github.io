  summary: >-
    The bodies, heads, and skin colors the game picks from when it rolls a zombie's looks, read once from the

    game's zombie customization config. A mod that restyles zombies offers these so its zombies look like the

    game's own.
  example: []
  syntax:
    content: public static TimbnZombieSkins? Looks(string dataId = "zombie_worker")
    parameters:
    - id: dataId
      type: System.String
      description: Which kind of zombie, the worker zombie by default.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnZombieSkins
      description: The looks, or null when the game has no such kind.
    content.vb: Public Shared Function Looks(dataId As String = "zombie_worker") As TimbnZombieSkins
