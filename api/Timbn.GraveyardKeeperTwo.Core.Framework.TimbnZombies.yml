  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The zombies standing in the world of the loaded save, whatever job they have. Zombies lying on the ground

    as items are not included. Empty at the main menu.
  example:
  - <pre><code class="lang-csharp">var caretakers = TimbnZombies.All().Count(zombie =&gt; zombie.ZombieType == ZombieType.Caretaker);</code></pre>
  syntax:
    content: public static List<ZombieWgoData> All()
    return:
      type: System.Collections.Generic.List{ZombieWgoData}
      description: Each zombie's world object.
    content.vb: Public Shared Function All() As List(Of ZombieWgoData)
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnZombies.All*
