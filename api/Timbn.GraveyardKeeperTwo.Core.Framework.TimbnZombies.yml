  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The zombie a station holds, either lying in its slot as an item (a station made with HoldsZombie, or the game's

    autopsy table) or working it. Use it to pay the zombie tech points when a craft there ends.
  example: []
  syntax:
    content: public static ZombieWgoData? AtStation(WgoData station)
    parameters:
    - id: station
      type: WgoData
      description: The station.
    return:
      type: ZombieWgoData
      description: The zombie, or null when the station holds none.
    content.vb: Public Shared Function AtStation(station As WgoData) As ZombieWgoData
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnZombies.AtStation*
