    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Stations/TimbnZombies.cs
    startLine: 84
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Redraws a zombie after its looks or gear changed in its data, the way the game does when it spawns. It

    covers a zombie standing in the world, one lying on the ground as an item, and a fighter. Events.ZombieViewReady

    runs again for a zombie standing in the world, except a fighter.
  example:
  - >-
    <pre><code class="lang-csharp">ZombieSkinHelper.ApplySkinToZombieWgoData(zombie, body, head, bodyColor, headColor);

    TimbnZombies.Redraw(zombie);</code></pre>
  syntax:
    content: public static bool Redraw(ZombieWgoData zombie)
    parameters:
    - id: zombie
      type: ZombieWgoData
      description: The zombie.
    return:
      type: System.Boolean
      description: False when the zombie has no view to redraw right now, or at the main menu.
    content.vb: Public Shared Function Redraw(zombie As ZombieWgoData) As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnZombies.Redraw*
