    id: DayFractionBetween
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Clock/TimbnClock.cs
    startLine: 97
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    How far the clock moved from <code class="paramref">from</code> to <code class="paramref">to</code>, as a fraction of a day. It

    counts across midnight, so 0.9 to 0.1 is 0.2. Useful with TimeOfDayChanged to work out how much game time

    passed since the last tick.
  example: []
  syntax:
    content: public static float DayFractionBetween(float from, float to)
    parameters:
    - id: from
      type: System.Single
      description: The earlier time of day.
    - id: to
      type: System.Single
      description: The later time of day.
    return:
      type: System.Single
      description: The part of a day between the two, from 0 up to but not including 1.
    content.vb: Public Shared Function DayFractionBetween(from As Single, [to] As Single) As Single
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnClock.DayFractionBetween*
