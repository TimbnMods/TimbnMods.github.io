    id: SetTime
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Clock/TimbnClock.cs
    startLine: 111
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Sets the time of day, the way the game does when a cutscene jumps the clock. The lighting and everything

    that follows the clock update at once. The day does not change, so setting a time earlier than now turns the

    clock back within the same day.
  example:
  - <pre><code class="lang-csharp">TimbnClock.SetTime(0.25f);</code></pre>
  syntax:
    content: public static bool SetTime(float timeOfDay)
    parameters:
    - id: timeOfDay
      type: System.Single
      description: The new time, from 0 at midnight to 1 at the next midnight. Values outside wrap around.
    return:
      type: System.Boolean
      description: False at the main menu, when there is no clock to set.
    content.vb: Public Shared Function SetTime(timeOfDay As Single) As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnClock.SetTime*
  nameWithType.vb: TimbnClock.SetTime(Single)
