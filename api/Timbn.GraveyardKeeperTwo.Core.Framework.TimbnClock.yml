    startLine: 74
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The game clock in minutes since the save began, counting whole days and the part of today. Use it for waits

    that follow game time, so they stop while the game is paused and speed up with it, and are never real seconds.
  example:
  - >-
    <pre><code class="lang-csharp">_leaveAt = TimbnClock.Minutes + 30;

    // later

    if (TimbnClock.Minutes &gt;= _leaveAt)
        herm.WalkTo("npc_sim_village_right_side_road_34");</code></pre>
  syntax:
    content: public static double Minutes { get; }
    parameters: []
    return:
      type: System.Double
    content.vb: Public Shared ReadOnly Property Minutes As Double
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnClock.Minutes*
