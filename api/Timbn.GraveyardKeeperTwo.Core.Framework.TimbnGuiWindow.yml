  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    An IMGUI box for a plugin's debug or cheat menu, opened and closed with a key from the plugin's config. Core

    draws the box, a title line that names the key to close it, and a "load a save" note while no save is loaded,

    so the plugin only draws what goes inside. Get one from the plugin's UI.DebugWindow.
  example:
  - >-
    <pre><code class="lang-csharp">var menu = UI.CreateDebugWindow("Timbn Cheats", DrawCheats, PluginConfig.ToggleMenu);

    menu.Area = new Rect(20, 20, 420, 640);</code></pre>
  syntax:
    content: public sealed class TimbnGuiWindow
    content.vb: Public NotInheritable Class TimbnGuiWindow
