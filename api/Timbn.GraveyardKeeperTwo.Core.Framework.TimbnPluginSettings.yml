  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Keeps a registration alive only while a toggle is on. Subscribe runs straight away if the toggle is on and

    again each time it turns on, and what it returns is disposed as soon as the toggle turns off. It suits any

    Core registration, such as a timer, an event handler, or a balance edit, so a tweak that is switched off

    costs nothing and its handlers need no check of the setting.
  example:
  - <pre><code class="lang-csharp">Settings.While(PluginConfig.StuckCarriers, () =&gt; Events.EveryRealSeconds(0.5f, stuckCarriers.Tick));</code></pre>
  syntax:
    content: public IDisposable While(ConfigEntry<bool> entry, Func<IDisposable> subscribe)
    parameters:
    - id: entry
      type: BepInEx.Configuration.ConfigEntry{System.Boolean}
      description: The toggle.
    - id: subscribe
      type: System.Func{System.IDisposable}
      description: Makes the registration and returns its handle.
    return:
      type: System.IDisposable
      description: A handle that stops following the toggle and disposes the registration when disposed. You don't need to keep it.
    content.vb: Public Function [While](entry As ConfigEntry(Of Boolean), subscribe As Func(Of IDisposable)) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginSettings.While*
