  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Ties a toggle to the change it makes. While the toggle is on, apply runs on every save load and as soon as

    the toggle turns on during play. Revert runs as soon as the toggle turns off and when the plugin unloads.

    Both run straight away if a save is already loaded. At the main menu, revert only runs for a change that

    was applied.
  example:
  - >-
    <pre><code class="lang-csharp">Settings.Toggle(PluginConfig.StuckCarriers, stuckCarriers.Reset, stuckCarriers.Revert);

    Settings.Toggle(PluginConfig.StuckResourceWorkers, Repair);</code></pre>
  syntax:
    content: public IDisposable Toggle(ConfigEntry<bool> entry, Action apply, Action? revert = null)
    parameters:
    - id: entry
      type: BepInEx.Configuration.ConfigEntry{System.Boolean}
      description: The toggle.
    - id: apply
      type: System.Action
      description: Makes the change. It can run more than once, so it must skip work already done.
    - id: revert
      type: System.Action
      description: >-
        Undoes the change. It can run when nothing was applied, so it must cope with that. Leave it out for a fix

        that runs once per save and has nothing to undo.
    return:
      type: System.IDisposable
      description: A handle that stops following the toggle and reverts when disposed. You don't need to keep it.
    content.vb: Public Function Toggle(entry As ConfigEntry(Of Boolean), apply As Action, revert As Action = Nothing) As IDisposable
