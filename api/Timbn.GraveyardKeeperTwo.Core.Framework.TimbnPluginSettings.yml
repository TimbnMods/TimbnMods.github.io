  summary: >-
    Whether a toggle is on and its feature is working, which is what <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginSettings.Toggle(BepInEx.Configuration.ConfigEntry%7bSystem.Boolean%7d%2cSystem.Action%2cSystem.Action)" data-throw-if-not-resolved="false"></xref>

