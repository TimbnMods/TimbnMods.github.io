  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Ties a setting of any type to the change it makes, like <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginSettings.Toggle(BepInEx.Configuration.ConfigEntry%7bSystem.Boolean%7d%2cSystem.Action%2cSystem.Action)" data-throw-if-not-resolved="false"></xref>

    with isOn deciding which values count as on. Any change to the value reverts first and then applies again if

    the new value is on, so apply can read the new value.
  example:
  - <pre><code class="lang-csharp">Settings.Toggle(PluginConfig.TechPointCap, cap =&gt; cap &gt; 999, _techPointCap.Apply, _techPointCap.Revert);</code></pre>
  syntax:
    content: public IDisposable Toggle<T>(ConfigEntry<T> entry, Func<T, bool> isOn, Action apply, Action? revert = null)
    parameters:
    - id: entry
      type: BepInEx.Configuration.ConfigEntry{{T}}
      description: The setting.
    - id: isOn
      type: System.Func{{T},System.Boolean}
      description: Whether a value of the setting turns the change on.
    - id: apply
      type: System.Action
      description: Makes the change. It can run more than once, so it must skip work already done.
    - id: revert
      type: System.Action
      description: Undoes the change. It can run when nothing was applied, so it must cope with that. Can be null.
    typeParameters:
    - id: T
    return:
      type: System.IDisposable
      description: A handle that stops following the setting and reverts when disposed. You don't need to keep it.
    content.vb: Public Function Toggle(Of T)(entry As ConfigEntry(Of T), isOn As Func(Of T, Boolean), apply As Action, revert As Action = Nothing) As IDisposable
