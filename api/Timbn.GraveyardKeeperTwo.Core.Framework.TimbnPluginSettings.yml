  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Runs your code whenever a setting's value changes, such as from a config manager or a reloaded config file.

    The handler is removed when the plugin unloads, and a throw is logged. Prefer Toggle or While when the

    setting switches a change on and off.
  example:
  - <pre><code class="lang-csharp">Settings.Changed(PluginConfig.TimeSpeed, speed =&gt; Logger.LogInfo($"Meditation time speed is now {speed}"));</code></pre>
  syntax:
    content: public IDisposable Changed<T>(ConfigEntry<T> entry, Action<T> handler)
    parameters:
    - id: entry
      type: BepInEx.Configuration.ConfigEntry{{T}}
      description: The setting.
    - id: handler
      type: System.Action{{T}}
      description: Gets the new value.
    typeParameters:
    - id: T
    return:
      type: System.IDisposable
      description: A handle that unsubscribes early when disposed. You don't need to keep it.
    content.vb: Public Function Changed(Of T)(entry As ConfigEntry(Of T), handler As Action(Of T)) As IDisposable
