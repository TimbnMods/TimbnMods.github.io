    startLine: 69
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a person to the loaded save at a point, such as one more villager. The game's life simulator leaves them

    alone, so walk them yourself. They are removed again when the handle is disposed, the plugin unloads or the

    player returns to the main menu, and are left out of every save the game writes.
  example:
  - <pre><code class="lang-csharp">Npcs.Spawn(TimbnGameIds.Npcs.Villager03, "npc_sim_village_left_side_road_01")?.WalkTo("npc_sim_village_tavern_03");</code></pre>
  syntax:
    content: public TimbnNpc? Spawn(string npcId, string pointId)
    parameters:
    - id: npcId
      type: System.String
      description: The kind of person, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>.
    - id: pointId
      type: System.String
      description: The id of the point to put them at, such as npc_sim_village_left_side_road_01.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc
      description: The handle, or null when the point or the person is missing or at the main menu.
    content.vb: Public Function Spawn(npcId As String, pointId As String) As TimbnNpc
