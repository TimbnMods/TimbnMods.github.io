  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Gets a handle to move a person in the loaded save outside a schedule, such as in a quest. Asking again in the

    same save gives the same handle. People added with Spawn are left out, so use the handle Spawn gave.
  example:
  - <pre><code class="lang-csharp">Npcs.Find(TimbnGameIds.Npcs.Herm)?.WalkTo("npc_sim_village_right_side_03");</code></pre>
  syntax:
    content: public TimbnNpc? Find(string npcId)
    parameters:
    - id: npcId
      type: System.String
      description: The person, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc
      description: The handle, or null when they are not in the loaded world or at the main menu.
    content.vb: Public Function Find(npcId As String) As TimbnNpc
