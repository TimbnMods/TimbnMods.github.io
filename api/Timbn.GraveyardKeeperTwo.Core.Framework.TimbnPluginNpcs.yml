  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Gives people a day on the game clock, moves them and adds new ones for a plugin. Everything is owned by the

    plugin, so walks it started stop, claims are let go and added people are removed when it unloads. People, groups,

    events and animations come from the generated <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>, <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Groups" data-throw-if-not-resolved="false"></xref>,

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.NpcEvents" data-throw-if-not-resolved="false"></xref> and <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.NpcAnimations" data-throw-if-not-resolved="false"></xref>, and points are named by their id. Reach it

    through the plugin's Npcs property.
  example: []
  syntax:
    content: public sealed class TimbnPluginNpcs
    content.vb: Public NotInheritable Class TimbnPluginNpcs
