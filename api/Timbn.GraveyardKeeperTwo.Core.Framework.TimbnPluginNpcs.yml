    id: AddVillager
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnPluginNpcs.cs
    startLine: 114
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds one more of a kind of villager, who lives exactly like the ones the game placed. They join the same life

    simulator group, go out to its points by day and home at night. They start at their home and go straight out

    when the rest of their group is out. They are removed when the handle is disposed, the plugin unloads or the

    player returns to the main menu, and are left out of every save the game writes.
  example:
  - <pre><code class="lang-csharp">Npcs.AddVillager(TimbnGameIds.Npcs.Villager03);</code></pre>
  syntax:
    content: public TimbnNpc? AddVillager(string npcId)
    parameters:
    - id: npcId
      type: System.String
      description: The kind of villager, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref> or <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcs.GroupMemberIds(System.String)" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc
      description: The handle, or null when the kind has no group or home, the group has no point left for one more, or at the main menu.
    content.vb: Public Function AddVillager(npcId As String) As TimbnNpc
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginNpcs.AddVillager*
  nameWithType.vb: TimbnPluginNpcs.AddVillager(String)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginNpcs.AddVillager(String)
  name.vb: AddVillager(String)
