    id: CloseTradeWhen
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnPluginNpcs.cs
    startLine: 152
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Keeps a vendor's trade window shut while a check says they are away, with the vendor saying a line in its

    place, such as outside the hours of their schedule.
  example:
  - <pre><code class="lang-csharp">Npcs.CloseTradeWhen(TimbnGameIds.Npcs.Herm, () =&gt; TimbnClock.Weekday == TimbnWeekday.Pride, "my_mod_herm_resting");</code></pre>
  syntax:
    content: public IDisposable CloseTradeWhen(string vendorId, Func<bool> isClosed, string? lineKey = null)
    parameters:
    - id: vendorId
      type: System.String
      description: The vendor, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>.
    - id: isClosed
      type: System.Func{System.Boolean}
      description: True while the window should stay shut.
    - id: lineKey
      type: System.String
      description: A text key added with Text.Add, said by the vendor in their speech bubble, or null for none.
    return:
      type: System.IDisposable
      description: A handle that lets trade open again when disposed. It is also removed when the plugin unloads.
    content.vb: Public Function CloseTradeWhen(vendorId As String, isClosed As Func(Of Boolean), lineKey As String = Nothing) As IDisposable
