    id: Preload
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnPluginNpcs.cs
    startLine: 99
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Loads the look of some kinds of people in the background, so the first Spawn of each kind in a session doesn't

    stall a frame for 10 to 30 ms while the game loads it. Call it when a save is ready, with every kind the mod

    may spawn. Copies count the ones the game already shows, so a kind out in the village with copies at 1 gets

    nothing ready, and a second one spawned then still stalls. Ask for 2 when the game's own may be about.
  example:
  - '<pre><code class="lang-csharp">Events.SaveReady(() =&gt; Npcs.Preload(TimbnNpcs.GroupMemberIds(TimbnGameIds.Groups.VillagersDayAll), copies: 2));</code></pre>'
  syntax:
    content: public void Preload(IEnumerable<string> npcIds, int copies = 1)
    parameters:
    - id: npcIds
      type: System.Collections.Generic.IEnumerable{System.String}
      description: The kinds of people, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref> or <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcs.GroupMemberIds(System.String)" data-throw-if-not-resolved="false"></xref>.
    - id: copies
      type: System.Int32
      description: How many of each kind to have ready, counting the ones already shown.
    content.vb: Public Sub Preload(npcIds As IEnumerable(Of String), copies As Integer = 1)
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginNpcs.Preload*
  nameWithType.vb: TimbnPluginNpcs.Preload(IEnumerable(Of String), Integer)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginNpcs.Preload(System.Collections.Generic.IEnumerable(Of String), Integer)
  name.vb: Preload(IEnumerable(Of String), Integer)
