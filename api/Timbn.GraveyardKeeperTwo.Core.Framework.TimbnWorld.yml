  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The zones a spot lies in, smallest first, read from the scene's data so it works for a scene that is not

    loaded around the player. Zones can nest, so a spot in a room is also in the building around it.
  example:
  - <pre><code class="lang-csharp">var zone = TimbnWorld.ZonesAt(TimbnPlayer.Position).FirstOrDefault();</code></pre>
  syntax:
    content: public static List<WorldZoneData> ZonesAt(Vector3 position, GameSceneData? scene = null)
    parameters:
    - id: position
      type: UnityEngine.Vector3
      description: The spot to look at.
    - id: scene
      type: GameSceneData
      description: The scene to look in. Leave it out for the scene the player is in.
    return:
      type: System.Collections.Generic.List{WorldZoneData}
      description: The zones containing the spot, smallest first. Empty when it is in none or at the main menu.
    content.vb: Public Shared Function ZonesAt(position As Vector3, scene As GameSceneData = Nothing) As List(Of WorldZoneData)
