  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Every world object of one definition in the loaded save, such as every sawhorse, in every scene, read from

    the game's own by id cache rather than by walking every scene.
  example:
  - <pre><code class="lang-csharp">var hasSawhorse = TimbnWorld.FindAll("sawhorse").Count &gt; 0;</code></pre>
  syntax:
    content: public static IReadOnlyList<WgoData> FindAll(string definitionId)
    parameters:
    - id: definitionId
      type: System.String
      description: The definition's id from the balance, such as sawhorse, or an NPC's id from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Collections.Generic.IReadOnlyList{WgoData}
      description: A copy of the list, so objects can be removed while looping it. Empty when there are none or at the main menu.
    content.vb: Public Shared Function FindAll(definitionId As String) As IReadOnlyList(Of WgoData)
