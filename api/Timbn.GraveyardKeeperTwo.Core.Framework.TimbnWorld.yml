    startLine: 35
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Every world object in the loaded save, in every scene, loaded around the player or not. World objects are

    everything placed in the world, such as chests, stations, graves, NPCs, and zombies. It walks every scene, so

    use <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnWorld.FindAll(System.String)" data-throw-if-not-resolved="false"></xref> when the definition id is known.
  example:
  - >-
    <pre><code class="lang-csharp">foreach (var station in TimbnWorld.Objects(wgo =&gt; wgo.CraftComponent != null))
        station.CraftComponent.ResetCraftsFromBalanceCache();</code></pre>
  syntax:
    content: public static IEnumerable<WgoData> Objects(Func<WgoData, bool>? match = null)
    parameters:
    - id: match
      type: System.Func{WgoData,System.Boolean}
      description: Which objects to keep. Leave it out to keep all of them.
    return:
      type: System.Collections.Generic.IEnumerable{WgoData}
      description: The matching objects, scene by scene. Empty at the main menu.
    content.vb: Public Shared Function Objects(match As Func(Of WgoData, Boolean) = Nothing) As IEnumerable(Of WgoData)
