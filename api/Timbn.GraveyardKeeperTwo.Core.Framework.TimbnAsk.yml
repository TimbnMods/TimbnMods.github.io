  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: One answer the player can pick.
  example: []
  syntax:
    content: public TimbnAsk Answer(string text, Action<TimbnLines>? then = null, Action<TimbnNeeds>? needs = null, Action<TimbnCost>? cost = null, Action<TimbnRewards>? reward = null, string? key = null)
    parameters:
    - id: text
      type: System.String
      description: The answer.
    - id: then
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLines}
      description: What follows it. Leave it out to carry straight on.
    - id: needs
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNeeds}
      description: >-
        What has to be true to pick it, checked but not taken, such as reputation with the NPC the player is talking to.

        The answer shows a lock for each and is grayed out until they are all met.
    - id: cost
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCost}
      description: What the player pays when they pick it. The answer shows the price and is grayed out until they can pay.
    - id: reward
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnRewards}
      description: >-
        What the player gets for picking it. The game pays money, items and resources when it is picked, and Core

        pays reputation with the NPC the player is talking to.
    - id: key
      type: System.String
      description: A name for the answer's localization key, such as accept, in place of a number. See <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTalk%601.Named(System.String)" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnAsk
      description: These answers, for chaining.
    content.vb: Public Function Answer(text As String, [then] As Action(Of TimbnLines) = Nothing, needs As Action(Of TimbnNeeds) = Nothing, cost As Action(Of TimbnCost) = Nothing, reward As Action(Of TimbnRewards) = Nothing, key As String = Nothing) As TimbnAsk
