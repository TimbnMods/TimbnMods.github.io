  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Starts the day in a save only once the person stands on this point, such as their spawn point, so someone the

    story keeps somewhere else is left alone until the story brings them there. Once the day started it is not

    checked again until the save closes or the day's check turns false.
  example:
  - <pre><code class="lang-csharp">day.StartWhenAt("RT_larry_spawn");</code></pre>
  syntax:
    content: public TimbnNpcDay StartWhenAt(string pointId)
    parameters:
    - id: pointId
      type: System.String
      description: The point the person must stand on, such as RT_larry_spawn.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcDay
    content.vb: Public Function StartWhenAt(pointId As String) As TimbnNpcDay
