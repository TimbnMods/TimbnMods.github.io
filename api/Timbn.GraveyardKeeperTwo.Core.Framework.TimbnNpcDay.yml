  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes every walk that sets off from a point go by another point first, and every walk heading to it come by

    that point last, such as a home point behind a counter. The hop between the two is over the navmesh unless

    another walk is given.
  example:
  - <pre><code class="lang-csharp">day.Doorway("RT_tavern_owner_spawn", "village_letter_owner_spawn", TimbnWalk.Straight);</code></pre>
  syntax:
    content: public TimbnNpcDay Doorway(string pointId, string viaId, TimbnWalk walk = TimbnWalk.Navmesh)
    parameters:
    - id: pointId
      type: System.String
      description: The point, such as a home point.
    - id: viaId
      type: System.String
      description: The point every walk to or from it passes.
    - id: walk
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnWalk
      description: How to cross between the two.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcDay
    content.vb: Public Function Doorway(pointId As String, viaId As String, walk As TimbnWalk = TimbnWalk.Navmesh) As TimbnNpcDay
