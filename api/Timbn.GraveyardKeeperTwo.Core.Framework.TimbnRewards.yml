  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Shows an item on the answer without giving it, for a reward your own code hands out, such as a Give line after

    the answer. It looks the same as <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnRewards.Item(System.String%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.
  example:
  - '<pre><code class="lang-csharp">ask.Answer("Trade a stick for boards.", then =&gt; then.Give("flitch", 2), cost: cost =&gt; cost.Item("stick"), reward: reward =&gt; reward.ShowItem("flitch", 2))</code></pre>'
  syntax:
    content: public TimbnRewards ShowItem(string itemId, int count = 1)
    parameters:
    - id: itemId
      type: System.String
      description: The item id.
    - id: count
      type: System.Int32
      description: How many to show.
    return:
