    it from the quest tree and log until it starts again, so it only ever takes one entry. With a

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder.Setup(System.Func%7bTimbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestRun%2cSystem.Boolean%7d)" data-throw-if-not-resolved="false"></xref> the next play waits for the next NewRun. Without one, the quest is offered again the usual way.

    No other quest can use OfferAfter or ContinuesFrom on a repeatable quest.
