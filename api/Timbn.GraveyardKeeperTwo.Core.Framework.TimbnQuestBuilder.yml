    parameters:
    - id: phase
      type: System.Int32
      description: The ring, 1 to 5.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder
      description: This builder, for chaining.
    content.vb: Public Function Phase(phase As Integer) As TimbnQuestBuilder
