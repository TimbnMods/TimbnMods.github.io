- uid: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder.AddStage(System.String,System.String,System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestStage})
  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder.AddStage(System.String,System.String,System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestStage})
  id: AddStage(System.String,System.String,System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestStage})
  parent: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder
  langs:
