  nameWithType: TimbnQuestBuilder.AddStage(string, string, Action<TimbnQuestStage>)
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder.AddStage(string, string, System.Action<Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestStage>)
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Quests/TimbnQuestBuilder.cs
      branch: core/2/main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: AddStage
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Quests/TimbnQuestBuilder.cs
    startLine: 718
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds the next stage of the quest, written in the same place. Core makes each stage its own game quest, continuing

    the one before in the same spot in the quest tree, with the game's own start and complete popups, and each starts

    by itself once the stage before is done. When the quest itself has stage parts (a Description, a Talk, a ReadyOn

    and so on), it is the first stage and this one the next. Otherwise the first AddStage is the first stage and keeps

    the quest's id, and the quest's offer, OfferWhen, StartsOn, OfferAfter and Icon belong to it. Every later stage's id is

    the quest id plus the stage name. The quest's DoneDescription describes the end of the last stage.
  example:
  - >-
    <pre><code class="lang-csharp">Quests.Add("my_gold_wine", TimbnGameIds.Npcs.Larry, "Larry's Gold Wine", quest =&gt; quest
        .Offer(talk =&gt; talk.Say("Could you find me some gold wine?").Accept("Sure."))
        .AddStage("pay", "Pay Herm for the gold wine.", stage =&gt; stage
            .TalksWith(TimbnGameIds.Npcs.Herm)
            .Cost(cost =&gt; cost.Money(200))
            .Talk(talk =&gt; talk
                .PlayerSay("Larry wants gold wine.")
                .Say("That'll be 2 silver.")
                .Accept("Here's the silver.")
                .Decline("Not now.")))
        .AddStage("deliver", "Bring Larry the gold wine.", stage =&gt; stage
            .Cost(cost =&gt; cost.Item("grape_wine:3"))
            .Talk(talk =&gt; talk.Accept("Here's your wine.")))
        .DoneDescription("Larry got his gold wine."));</code></pre>
  syntax:
    content: public TimbnQuestBuilder AddStage(string name, string description, Action<TimbnQuestStage> stage)
    parameters:
    - id: name
      type: System.String
      description: A short name of lowercase letters, digits and underscores. It is part of the stage's id, so keep it stable.
    - id: description
      type: System.String
      description: The quest description during this stage.
    - id: stage
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestStage}
      description: Sets up the stage.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder
      description: This builder, for chaining.
    content.vb: Public Function AddStage(name As String, description As String, stage As Action(Of TimbnQuestStage)) As TimbnQuestBuilder
