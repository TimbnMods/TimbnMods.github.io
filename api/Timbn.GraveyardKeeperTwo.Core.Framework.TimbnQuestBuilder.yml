    startLine: 247
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes the quest the next step of another of your quests, the way the game chains its own quests. It takes that

    quest's place in the quest tree, sharing its cell, and the tree shows the newest step there. With no Offer or

    StartsOn of its own, it starts within about a second of that quest being completed, once its OfferWhen is true

    too if it has one. Only a mod quest can be continued, since a mod never takes a game quest's place.
  example:
  - >-
    <pre><code class="lang-csharp">var ask = Quests.Add("my_wine_ask", TimbnGameIds.Npcs.Larry, "Larry's Wine", quest =&gt; ...);

    Quests.Add("my_wine_pay", TimbnGameIds.Npcs.Larry, "Paying for the Wine", quest =&gt; quest
        .ContinuesFrom(ask)
        .Description("Pay Herm for the wine.")
        ...);</code></pre>
  syntax:
    content: public TimbnQuestBuilder ContinuesFrom(TimbnQuest quest)
    parameters:
    - id: quest
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuest
      description: The quest returned by an earlier Quests.Add. For a quest with stages, this continues its last stage.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder
      description: This builder, for chaining.
    content.vb: Public Function ContinuesFrom(quest As TimbnQuest) As TimbnQuestBuilder
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder.ContinuesFrom*
