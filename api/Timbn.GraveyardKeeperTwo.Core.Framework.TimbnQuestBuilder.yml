    startLine: 381
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Fills a new run of the quest when your code calls the quest's NewRun, such as picking a villager and the dish they

    want. Until a run is rolled the quest is never offered or started. Text anywhere in the quest shows a run value

    by its name in braces, such as {dish}, and the overloads of Giver, TalksWith, Needs, Cost and Reward that take a run

    read it. The run is kept with the save and ends when the quest is done or canceled.
  example:
  - >-
    <pre><code class="lang-csharp">.Setup(run =&gt;

    {
        var villagers = TimbnNpcs.GroupMemberIds(TimbnGameIds.Groups.VillagersDayAll);
        if (villagers.Count == 0)
            return false;

        run.Npc("villager", villagers[UnityEngine.Random.Range(0, villagers.Count)]).Item("dish", "cook_muffin");
        return true;
    })</code></pre>
  syntax:
    content: public TimbnQuestBuilder Setup(Func<TimbnQuestRun, bool> setup)
    parameters:
    - id: setup
      type: System.Func{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestRun,System.Boolean}
      description: Fills the run. Return false when nothing fits right now, and no run starts.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder
      description: This builder, for chaining.
    content.vb: Public Function Setup(setup As Func(Of TimbnQuestRun, Boolean)) As TimbnQuestBuilder
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestBuilder.Setup*
  nameWithType.vb: TimbnQuestBuilder.Setup(Func(Of TimbnQuestRun, Boolean))
