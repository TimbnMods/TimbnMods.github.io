  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    The player's answer that accepts and starts the quest. With needs or a cost it is grayed out with the game's

    locks and prices until the player has them. A cost is taken when it is picked, and given back if the quest

    can't start.
  example:
  - "<pre><code class=\"lang-csharp\">.Accept(\"I'll sort it out.\", then =&gt; then.Say(\"Thanks!\"), needs: need =&gt; need.OnWeekday(TimbnWeekday.Pride))</code></pre>"
  syntax:
    content: public TimbnQuestOffer Accept(string text, Action<TimbnLines>? then = null, Action<TimbnNeeds>? needs = null, Action<TimbnCost>? cost = null)
    parameters:
    - id: text
      type: System.String
      description: The answer.
    - id: then
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLines}
      description: What the NPC says after it. Leave it out to say nothing.
    - id: needs
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNeeds}
      description: What has to be true to pick it. Reputation is with the quest giver.
    - id: cost
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCost}
      description: What the player pays to take the quest on.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuestOffer
      description: This conversation, for chaining.
    content.vb: Public Function Accept(text As String, [then] As Action(Of TimbnLines) = Nothing, needs As Action(Of TimbnNeeds) = Nothing, cost As Action(Of TimbnCost) = Nothing) As TimbnQuestOffer
