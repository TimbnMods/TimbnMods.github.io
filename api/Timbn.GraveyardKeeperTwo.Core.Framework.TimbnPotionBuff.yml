  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes a C# change the save would keep, such as a vendor's money. Core runs it when the buff starts, and

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPotionBuff.RevertChange" data-throw-if-not-resolved="false"></xref> takes it back just before every save and this puts it back right after, so the save

    never holds the change and removing the mod mid buff leaves nothing behind. Both run on every save, so keep

    them to setting state, with no sounds, toasts or drops.
  example: []
  syntax:
    content: public Action? ApplyChange { get; set; }
    parameters: []
    return:
      type: System.Action
