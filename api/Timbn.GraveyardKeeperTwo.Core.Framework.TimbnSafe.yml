  summary: Runs the code and logs a throw as an error naming what threw.
  example:
  - <pre><code class="lang-csharp">TimbnSafe.Run(LoadPacks, Logger, $"{nameof(QuestPacks)}|Loading the quest packs");</code></pre>
  syntax:
    content: public static bool Run(Action? action, ManualLogSource logger, string what)
    parameters:
    - id: action
      type: System.Action
      description: The code to run. Null counts as having run.
    - id: logger
      type: BepInEx.Logging.ManualLogSource
      description: The plugin's Logger, so the line shows under the plugin's name.
    - id: what
      type: System.String
      description: What the code is, for the log line, such as a class and what it was doing.
    return:
      type: System.Boolean
      description: True when the code ran through, false when it threw.
    content.vb: Public Shared Function Run(action As Action, logger As ManualLogSource, what As String) As Boolean
