  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a solid block from one picture of it as the player sees it, with the top face stacked above the front face.

    The upper <code class="paramref">depth</code> rows are the top and the rest are the front, so the front is the PNG's height

    minus the depth. Both share the block's x and width.
  example: []
  syntax:
    content: public TimbnModelFaces Block(string pngName, int x, int y, int z, int depth)
    parameters:
    - id: pngName
      type: System.String
      description: A PNG embedded in the plugin's DLL, named without ".png".
    - id: x
      type: System.Int32
      description: Pixels from the model's left edge to the block's left edge.
    - id: y
      type: System.Int32
      description: Pixels up from the floor to the block's bottom.
    - id: z
      type: System.Int32
      description: Pixels back from the model's front to the block's front.
    - id: depth
      type: System.Int32
      description: Front to back, in pixels, which is also how many rows of the picture are the top.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModelFaces
    content.vb: Public Function Block(pngName As String, x As Integer, y As Integer, z As Integer, depth As Integer) As TimbnModelFaces
