    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Audio/TimbnPluginAudio.cs
    startLine: 44
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Plays one of the game's sound effects once, such as item_use_drink when someone takes a drink or coins_sound

    when money changes hands. It plays at full volume wherever the player stands, ends on its own and needs no

    undo. Nothing plays at the main menu or for an empty id.
  example:
  - <pre><code class="lang-csharp">Audio.PlaySound(TimbnGameIds.Sounds.ItemUseDrink);</code></pre>
  syntax:
    content: public void PlaySound(string soundId)
    parameters:
    - id: soundId
      type: System.String
      description: The id of one of the game's sounds, the way an item's onUseSound names them.
    content.vb: Public Sub PlaySound(soundId As String)
