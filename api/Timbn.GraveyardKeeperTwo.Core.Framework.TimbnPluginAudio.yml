    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Audio/TimbnPluginAudio.cs
    startLine: 31
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Plays one of the game's music tracks on a loop, such as violin or char_theme_linda, fading out whatever music

    was playing. When the handle is disposed the track fades out and the music before it comes back. A newer track

    from any plugin takes over, and the music before both comes back when that one ends.
  example:
  - >-
    <pre><code class="lang-csharp">_song = Audio.PlayMusic(TimbnGameIds.Music.Violin);

    // once the performer stops

    _song.Dispose();</code></pre>
  syntax:
    content: public IDisposable PlayMusic(string trackId)
    parameters:
    - id: trackId
      type: System.String
      description: The id of a track in one of the game's playlists.
    return:
      type: System.IDisposable
      description: A handle that stops the track when disposed. It is also stopped when the plugin unloads and on the way to the main menu.
    content.vb: Public Function PlayMusic(trackId As String) As IDisposable
