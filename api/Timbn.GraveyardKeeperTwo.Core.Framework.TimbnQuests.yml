    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Quests/TimbnQuests.cs
    startLine: 240
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Whether the current run of any mod's quest names this NPC, such as the villager who asked for a dish. A quest's

    Setup can skip them, so one person never has two quests going at once.
  example:
  - <pre><code class="lang-csharp">var villagers = TimbnNpcs.GroupMemberIds(TimbnGameIds.Groups.VillagersDayAll).Where(npc =&gt; !TimbnQuests.HasQuestRun(npc)).ToList();</code></pre>
  syntax:
    content: public static bool HasQuestRun(string npcId)
    parameters:
    - id: npcId
      type: System.String
      description: The NPC, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Boolean
      description: True while a run names them. False at the main menu.
    content.vb: Public Shared Function HasQuestRun(npcId As String) As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuests.HasQuestRun*
