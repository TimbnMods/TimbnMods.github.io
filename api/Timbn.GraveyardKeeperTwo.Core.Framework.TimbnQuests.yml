    startLine: 176
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Fires one of the game's story triggers, the signals its quests and cutscenes wait on, as if the player had

    just built the building or won the fight. Use it to finish a game quest whose step was done before the quest

    started. Events.StoryTrigger hears it like any other. Nothing happens at the main menu.
  example:
  - >-
    <pre><code class="lang-csharp">if (TimbnPlayer.HasBuilt("zmb_choir_unlock_s"))
        TimbnQuests.FireStoryTrigger(GlobalEventsSystem.Event.Type.BuildBuilding, "zmb_choir_unlock");</code></pre>
  syntax:
    content: public static void FireStoryTrigger(GlobalEventsSystem.Event.Type type, string id = "")
    parameters:
    - id: type
      type: GlobalEventsSystem.Event.Type
      description: The kind of trigger.
    - id: id
      type: System.String
      description: The trigger's id, such as the building or the answer. Leave it out for a kind that has none.
    content.vb: Public Shared Sub FireStoryTrigger(type As GlobalEventsSystem.Event.Type, id As String = "")
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnQuests.FireStoryTrigger*
  nameWithType.vb: TimbnQuests.FireStoryTrigger(GlobalEventsSystem.Event.Type, String)
