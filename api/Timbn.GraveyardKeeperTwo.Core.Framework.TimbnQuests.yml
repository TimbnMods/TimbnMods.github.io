  summary: >-
    A quest's status in the loaded save, the game's own quests included, such as 6_intro_guards_burial. Null when

    no save is loaded or it has no such quest.
  example:
  - <pre><code class="lang-csharp">.OfferWhen(() =&gt; TimbnQuests.StatusOf("6_intro_guards_burial") is QuestStatus.InProgress or QuestStatus.Completed)</code></pre>
