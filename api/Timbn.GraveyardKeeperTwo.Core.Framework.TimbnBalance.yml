  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Builds a game expression that holds a plain text value, for a field that names an id but is typed as an

    expression, such as WGODef.replaceToWgoOnDie, WGODef.customAssetId or CraftDef.customCraftResultIcon. The game

    stores those as pure string values, and <code>new LazyExpression("grave_top_stn_1")</code> would try to evaluate the id

    as a formula and come out empty.
  example: []
  syntax:
    content: public static LazyExpression TextExpression(string value)
    parameters:
    - id: value
      type: System.String
      description: The text, usually an id.
    return:
      type: LazyExpression
      description: An expression that evaluates to the text.
    content.vb: Public Shared Function TextExpression(value As String) As LazyExpression
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnBalance.TextExpression*
  nameWithType.vb: TimbnBalance.TextExpression(String)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnBalance.TextExpression(String)
  name.vb: TextExpression(String)
