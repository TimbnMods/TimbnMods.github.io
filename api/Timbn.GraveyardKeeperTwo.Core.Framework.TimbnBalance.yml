    startLine: 157
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Builds a game expression from a formula the way the balance parses its own, for an expression field such as

    ItemDef.onUseExpressions, ExpressionGameRes.expression or CraftDef.onCraftEndExpressions. Unlike

    <code>new LazyExpression(formula)</code>, a #perk or $resource reference in it works, so

    <code>TimbnBalance.Expression("20+2*$food_eng_buff")</code> reads the player's food buff.
  example: []
  syntax:
    content: public static LazyExpression Expression(string formula)
    parameters:
    - id: formula
      type: System.String
      description: The formula, for example <code>AddPerk("buff_talent_blue_1")</code> or <code>3+2*#perk_cook_2</code>.
    return:
      type: LazyExpression
      description: The expression.
    content.vb: Public Shared Function Expression(formula As String) As LazyExpression
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnBalance.Expression*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The formula is empty.
  nameWithType.vb: TimbnBalance.Expression(String)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnBalance.Expression(String)
  name.vb: Expression(String)
