  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Changes an item's icon to any sprite the game has, or one added with the plugin's Sprites.AddPng. It sets the

    item's iconId and also its custom icon, so the two always match.
  example:
  - >-
    <pre><code class="lang-csharp">var original = "";

    Balance.Edit&lt;ItemDef&gt;(
        "fish_roach",
        fish =&gt; { original = TimbnBalance.GetIcon(fish); TimbnBalance.SetIcon(fish, "timbn_roach"); },
        fish =&gt; TimbnBalance.SetIcon(fish, original));</code></pre>
  syntax:
    content: public static void SetIcon(ItemDef item, string iconId)
    parameters:
    - id: item
      type: ItemDef
      description: The item to change.
    - id: iconId
      type: System.String
      description: The sprite name.
    content.vb: Public Shared Sub SetIcon(item As ItemDef, iconId As String)
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnBalance.SetIcon*
