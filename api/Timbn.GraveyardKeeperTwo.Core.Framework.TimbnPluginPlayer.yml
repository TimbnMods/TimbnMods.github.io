- uid: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.TakeControl
  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.TakeControl
  id: TakeControl
  parent: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer
  langs:
  - csharp
  - vb
  name: TakeControl()
  nameWithType: TimbnPluginPlayer.TakeControl()
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.TakeControl()
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: TakeControl
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
    startLine: 34
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Takes the player's control away, the way the game does during its own cutscenes and conversations. They

    cannot walk, interact, attack, use the hotbar, or open the game's menus with their keys, nothing can push

    them, and hotkeys checked with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.IsDownWithControl(BepInEx.Configuration.KeyboardShortcut)" data-throw-if-not-resolved="false"></xref> stay quiet. Each call adds its own

    reason to the game's list of reasons the player is held, and the game only gives control back once every

    reason has let go, so several plugins can take control at once and a game cutscene ending meanwhile never

    frees the player. Read your own keys with <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.IsDownInGame(LazyBearTechnology.GameKey)" data-throw-if-not-resolved="false"></xref> or

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnInput.IsDownInGame(BepInEx.Configuration.KeyboardShortcut)" data-throw-if-not-resolved="false"></xref> while it is held, and see <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPlayer.GameHasControl(TakenControlType%5b%5d)" data-throw-if-not-resolved="false"></xref> to

    notice the game stepping in.
  example:
  - >-
    <pre><code class="lang-csharp">_control = Player.TakeControl();

    // later

    _control?.Dispose();</code></pre>
  syntax:
    content: public IDisposable TakeControl()
    return:
      type: System.IDisposable
      description: A handle that gives control back when disposed. It is also released when the plugin unloads and on the way to the main menu.
    content.vb: Public Function TakeControl() As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.TakeControl*
- uid: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.MultiplyWalkSpeed(System.Single)
  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.MultiplyWalkSpeed(System.Single)
  id: MultiplyWalkSpeed(System.Single)
  parent: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer
  langs:
  - csharp
  - vb
  name: MultiplyWalkSpeed(float)
  nameWithType: TimbnPluginPlayer.MultiplyWalkSpeed(float)
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.MultiplyWalkSpeed(float)
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: MultiplyWalkSpeed
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
    startLine: 53
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes the player walk faster or slower until the returned handle is disposed. It multiplies the game's own

    speed without changing it, so the game's slowdowns, such as aiming a bow, still apply on top and cannot

    cancel it. Several plugins can hold a speed at once, and the newest one wins. When the last is released,

    the player walks at the game's speed again.
  example:
  - >-
    <pre><code class="lang-csharp">Buff = new TimbnPotionBuff

    {
        OnStart = () =&gt; _swift = Player.MultiplyWalkSpeed(1.5f),
        OnEnd = () =&gt; _swift?.Dispose(),
    };</code></pre>
  syntax:
    content: public IDisposable MultiplyWalkSpeed(float multiplier)
    parameters:
    - id: multiplier
      type: System.Single
      description: How many times the normal walking speed. 1 is normal.
    return:
      type: System.IDisposable
      description: A handle that ends the change when disposed. It is also released when the plugin unloads and on the way to the main menu.
    content.vb: Public Function MultiplyWalkSpeed(multiplier As Single) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.MultiplyWalkSpeed*
