  nameWithType: TimbnPluginPlayer.SlideTo(Vector3, Action?)
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.SlideTo(UnityEngine.Vector3, System.Action?)
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: SlideTo
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
    startLine: 147
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Moves the player to a spot along the NPC navmesh with the game's own walker, the way a story scene walks them,

    and calls back when they get there. Their physics is off on the way, so they never get stuck, but they pass

    through gaps and over ledges they could not walk by hand. Movement keys do not stop it, so dispose the handle

    to call it off. A newer slide, from any plugin, replaces this one, and then this one never calls back.
  example:
  - >-
    <pre><code class="lang-csharp">_slide?.Dispose();

    _slide = Player.SlideTo(hit.point);</code></pre>
  syntax:
    content: public IDisposable SlideTo(Vector3 position, Action? arrived = null)
    parameters:
    - id: position
      type: UnityEngine.Vector3
      description: Where to go.
    - id: arrived
      type: System.Action
      description: Runs once on arrival. It never runs after the handle is disposed or when the navmesh has no way there, which is logged.
    return:
      type: System.IDisposable
      description: A handle that stops the slide when disposed. It is also stopped when the plugin unloads and on the way to the main menu.
    content.vb: Public Function SlideTo(position As Vector3, arrived As Action = Nothing) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.SlideTo*
  nameWithType.vb: TimbnPluginPlayer.SlideTo(Vector3, Action)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.SlideTo(UnityEngine.Vector3, System.Action)
  name.vb: SlideTo(Vector3, Action)
