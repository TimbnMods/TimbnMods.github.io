  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.MultiplyWalkSpeed(Single)
  name.vb: MultiplyWalkSpeed(Single)
- uid: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.WalkTo(UnityEngine.Vector3,System.Action)
  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.WalkTo(UnityEngine.Vector3,System.Action)
  id: WalkTo(UnityEngine.Vector3,System.Action)
  parent: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer
  langs:
  - csharp
  - vb
  name: WalkTo(Vector3, Action?)
  nameWithType: TimbnPluginPlayer.WalkTo(Vector3, Action?)
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.WalkTo(UnityEngine.Vector3, System.Action?)
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: WalkTo
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
    startLine: 78
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Walks the player to a spot along the navmesh as if they held the movement keys, and calls back when they get

    there. They move at their own speed and only go where they could by hand, so walls, fences and ledges stop them.

    Without a hold, any movement input from the player ends the walk, as suits a walk they asked for, such as clicking

    where to go. Take control first for a walk a scene needs, and then the player cannot stop it. Control the game

    takes, such as a talk, ends the walk either way. A newer walk, from any plugin, takes over once its route is

    found, so the player keeps moving meanwhile and carries on when the newer one has no way. A spot the player does

    not fit, such as against a wall, is walked to as close as they fit.
  example:
  - >-
    <pre><code class="lang-csharp">_control = Player.TakeControl();

    _walk = Player.WalkTo(bench, SitDown);

    // later, to call it off

    _walk?.Dispose();</code></pre>
  syntax:
    content: public IDisposable WalkTo(Vector3 position, Action? arrived = null)
    parameters:
    - id: position
      type: UnityEngine.Vector3
      description: Where to walk to.
    - id: arrived
      type: System.Action
      description: >-
        Runs once on arrival. It never runs after the handle is disposed, when the walk is ended or taken over, or when

        the player has no way to within half a unit of the spot or gets blocked on the way, each of which is logged.
    return:
      type: System.IDisposable
      description: A handle that stops the walk when disposed. It is also stopped when the plugin unloads and on the way to the main menu.
    content.vb: Public Function WalkTo(position As Vector3, arrived As Action = Nothing) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.WalkTo*
  nameWithType.vb: TimbnPluginPlayer.WalkTo(Vector3, Action)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.WalkTo(UnityEngine.Vector3, System.Action)
  name.vb: WalkTo(Vector3, Action)
- uid: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.Carry(Item,System.Action,Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCarryRule)
  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.Carry(Item,System.Action,Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCarryRule)
  id: Carry(Item,System.Action,Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCarryRule)
  parent: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer
  langs:
  - csharp
  - vb
  name: Carry(Item, Action?, TimbnCarryRule)
  nameWithType: TimbnPluginPlayer.Carry(Item, Action?, TimbnCarryRule)
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.Carry(Item, System.Action?, Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCarryRule)
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: Carry
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Player/TimbnPluginPlayer.cs
    startLine: 116
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Puts an item in the player's hands, held over their head the way they carry a log. A player with a free carry

    slot keeps what they carried and holds the new item on top, otherwise what was on top is dropped, so check

    TimbnPlayer.HandsFree first when the item should be the only thing carried. A small item, such as a mug, shows

    its icon there. Pressing the interaction key with nothing in reach puts it down on the ground the way the game

    drops anything carried, and the game does the same when the player starts work or a fight. The item is kept

    out of every save the game writes, so a save never holds it. An item that is already carried is not handed

    over again, and the handle comes back already ended. The rule says how it sits in and leaves their hands. With

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCarryRule.Exclusive" data-throw-if-not-resolved="false"></xref> it is the only thing they hold, what they held before drops at their

    feet and nothing else can be picked up or handed to them meanwhile, and with

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCarryRule.OnlyByCode" data-throw-if-not-resolved="false"></xref> nothing but disposing the handle takes it either, for an item the

    player may only hand over at a spot the plugin handles itself.
  example:
  - >-
    <pre><code class="lang-csharp">_mug = Player.Carry(new Item("my_mod_mug"), () =&gt; TimbnItems.RemoveDrops(TimbnItems.FindDrops(drop =&gt; drop.Id == "my_mod_mug")));

    // once it is handed over

    _mug.Dispose();</code></pre>
  syntax:
    content: public IDisposable Carry(Item item, Action? putDown = null, TimbnCarryRule rule = TimbnCarryRule.Vanilla)
    parameters:
    - id: item
      type: Item
      description: The item to carry, such as one of the plugin's own added with Balance.Add.
    - id: putDown
      type: System.Action
      description: >-
        Runs once the player has put it down or the game took it, a frame later, so a dropped item is already on the

        ground. It does not run when the handle is disposed.
    - id: rule
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCarryRule
      description: How the item sits in and leaves the player's hands. By default as the game carries a log.
    return:
      type: System.IDisposable
      description: A handle that takes the item out of the player's hands when disposed, if they still carry it. It is also taken when the plugin unloads and on the way to the main menu.
    content.vb: Public Function Carry(item As Item, putDown As Action = Nothing, rule As TimbnCarryRule = TimbnCarryRule.Vanilla) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.Carry*
  nameWithType.vb: TimbnPluginPlayer.Carry(Item, Action, TimbnCarryRule)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginPlayer.Carry(Item, System.Action, Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCarryRule)
  name.vb: Carry(Item, Action, TimbnCarryRule)
