  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc.WalkTo(System.String,Timbn.GraveyardKeeperTwo.Core.Framework.TimbnWalk,System.Action,System.Action)
  id: WalkTo(System.String,Timbn.GraveyardKeeperTwo.Core.Framework.TimbnWalk,System.Action,System.Action)
