  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnNpc.cs
      branch: core/2/main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: RunSteps
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnNpc.cs
    startLine: 402
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Plays a list of steps on command, such as for a quest or a cutscene, and calls back when the last one is done.

    A new run on the same person replaces the one before. It starts at once, even in the middle of a conversation

    with them. The person still stops when the player starts talking to them later in the run, but not for a story

    scene, since a cutscene is when you want them moving. When the game itself moves them, through a story walk, a

    teleport or a script event, the run ends and leaves them to it. A schedule of theirs steps aside while it plays

    and takes them back as soon as it ends.
  example:
  - >-
    <pre><code class="lang-csharp">Npcs.Find(TimbnGameIds.Npcs.Larry)?.RunSteps(new TimbnNpcSteps()
        .Walk("RT_larry_spawn")
        .WaitRealSeconds(3)
        .WalkNavmesh("npc_sim_village_right_side_road_34")
        .Face(Direction.Down), done: OnLarryArrived);</code></pre>
  syntax:
    content: public IDisposable? RunSteps(TimbnNpcSteps steps, Action? done = null)
    parameters:
    - id: steps
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps
      description: What to do, in order.
    - id: done
      type: System.Action
      description: Runs once after the last step. It does not run when the run is stopped or replaced, the game takes the person, the save closes or the plugin unloads.
    return:
      type: System.IDisposable
      description: The run, which stops it when disposed, or null when the person is gone.
    content.vb: Public Function RunSteps(steps As TimbnNpcSteps, done As Action = Nothing) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc.RunSteps*
  nameWithType.vb: TimbnNpc.RunSteps(TimbnNpcSteps, Action)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc.RunSteps(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps, System.Action)
  name.vb: RunSteps(TimbnNpcSteps, Action)
