  nameWithType: TimbnNpc.WalkTo(string, TimbnWalk, Action?, Action?)
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc.WalkTo(string, Timbn.GraveyardKeeperTwo.Core.Framework.TimbnWalk, System.Action?, System.Action?)
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnNpc.cs
      branch: core/2/main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: WalkTo
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnNpc.cs
    startLine: 144
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Walks the person to a point and turns them the way it faces. A walk along the paths the paths do not reach is

    skipped, or tried again from the day's origin when the person has a schedule.
  example:
  - <pre><code class="lang-csharp">herm.WalkTo("npc_sim_village_right_side_road_34", TimbnWalk.Navmesh, () =&gt; herm.WalkTo("npc_sim_village_right_side_03"));</code></pre>
  syntax:
    content: public bool WalkTo(string pointId, TimbnWalk walk = TimbnWalk.Paths, Action? arrived = null, Action? failed = null)
    parameters:
    - id: pointId
      type: System.String
      description: The id of the point to walk to, such as npc_sim_village_right_side_03.
    - id: walk
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnWalk
      description: Along the game's paths, or over the navmesh.
    - id: arrived
      type: System.Action
      description: Runs once on arrival. It does not run when the walk is stopped or replaced, or cannot reach the point.
    - id: failed
      type: System.Action
      description: Runs once when the walk started but could not reach the point, so a chain of walks can go on or give up. It does not run when the walk is stopped or replaced.
    return:
      type: System.Boolean
      description: False when the point is missing, the paths do not reach it, or the person is gone.
    content.vb: Public Function WalkTo(pointId As String, walk As TimbnWalk = TimbnWalk.Paths, arrived As Action = Nothing, failed As Action = Nothing) As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc.WalkTo*
