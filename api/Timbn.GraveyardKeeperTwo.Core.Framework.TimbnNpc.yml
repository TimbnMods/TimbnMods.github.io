    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Npcs/TimbnNpc.cs
    startLine: 71
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Whether the person blocks the keeper like a wall. Set it to false for a crowd the keeper should be able to walk

    through, such as visitors who stand about the graveyard. It only changes the person's solid parts toward the

    keeper's body, so they are still talked to, hit and walked around by everyone else, and it carries over when the

    person streams out and back in. Leave it alone for someone the keeper has to be able to push against.
  example:
  - <pre><code class="lang-csharp">visitor.CollidesWithPlayer = false;</code></pre>
  syntax:
    content: public bool CollidesWithPlayer { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property CollidesWithPlayer As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc.CollidesWithPlayer*
