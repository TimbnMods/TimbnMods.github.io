  - vb
  name: MultiplyGameSpeed(float)
  nameWithType: TimbnPluginClock.MultiplyGameSpeed(float)
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginClock.MultiplyGameSpeed(float)
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Clock/TimbnPluginClock.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: MultiplyGameSpeed
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Clock/TimbnPluginClock.cs
    startLine: 31
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes the game's time run faster or slower until the returned handle is disposed, the way sleeping runs it

    50 times faster. Several plugins can hold a speed at once, and the newest one wins. When the last is

    released, the speed goes back to what it was, unless the game changed it meanwhile, in which case the game's

    value stays. Changing the speed directly with SetTimeSpeedMultiplier instead makes mods undo each other.
  example:
  - >-
    <pre><code class="lang-csharp">_fastTime = Clock.MultiplyGameSpeed(7f);

    // later

    _fastTime?.Dispose();</code></pre>
  syntax:
    content: public IDisposable MultiplyGameSpeed(float multiplier)
    parameters:
    - id: multiplier
      type: System.Single
      description: How many times faster than normal time runs. 1 is normal speed.
    return:
      type: System.IDisposable
      description: A handle that puts the speed back when disposed. It is also released when the plugin unloads and on the way to the main menu.
    content.vb: Public Function MultiplyGameSpeed(multiplier As Single) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginClock.MultiplyGameSpeed*
