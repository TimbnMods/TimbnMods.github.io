  - vb
  name: Freeze()
  nameWithType: TimbnPluginClock.Freeze()
  fullName: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginClock.Freeze()
  type: Method
  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/Clock/TimbnPluginClock.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: Freeze
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Clock/TimbnPluginClock.cs
    startLine: 47
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Stops the game's clock until the returned handle is disposed, so the time of day, the weather and the

    calendar stand still while the world keeps moving. Several plugins can hold it at once, and the clock runs

    again when the last one lets go, unless the game unpaused it meanwhile. Setting the clock's pause flag

    directly instead makes mods undo each other.
  example:
  - >-
    <pre><code class="lang-csharp">_frozen = Clock.Freeze();

    // later

    _frozen?.Dispose();</code></pre>
  syntax:
    content: public IDisposable Freeze()
    return:
      type: System.IDisposable
      description: A handle that starts the clock again when disposed. It is also released when the plugin unloads and on the way to the main menu.
    content.vb: Public Function Freeze() As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginClock.Freeze*
