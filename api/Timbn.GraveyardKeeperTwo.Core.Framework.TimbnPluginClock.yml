- uid: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginClock.MultiplyGameSpeed(System.Single)
  commentId: M:Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginClock.MultiplyGameSpeed(System.Single)
