    id: TimbnExtensionBuilder
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Stations/TimbnExtensionBuilder.cs
    startLine: 19
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Describes a bench extension for the plugin's Stations.AddExtension, like the game's tool rack. An extension is

    placed straight from the build desk with no construction site, has nothing to interact with, and attaches to a

    station that lists it in <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Extensions(System.String%2cSystem.String%5b%5d)" data-throw-if-not-resolved="false"></xref> when the two are built next to each other.

    Core turns it into the extension, its build desk entry and its removal, with their text. Only <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnExtensionBuilder.Model(Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel%2cUnityEngine.Vector3)" data-throw-if-not-resolved="false"></xref>

    is required. An extension with no <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnExtensionBuilder.Cost(System.ValueTuple%7bSystem.String%2cSystem.Int32%7d%5b%5d)" data-throw-if-not-resolved="false"></xref> is free, and one with no <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnExtensionBuilder.UnlockedBy(System.String)" data-throw-if-not-resolved="false"></xref> is on the

    build desk from the start.
  example:
  - >-
    A pillar that opens a craft at the Stick Box when built next to it.


    <pre><code class="lang-csharp">Stations.AddExtension("timbn_red_magic", "Red Magic Pillar", "A humming red pillar.", pillar =&gt; pillar
        .Model(bundle.Model("RedPillar"), new Vector3(0.5f, 1f, 0.5f))
        .Icon("timbn_red_magic")
        .Cost(("flitch", 2)));</code></pre>
  syntax:
    content: public sealed class TimbnExtensionBuilder
    content.vb: Public NotInheritable Class TimbnExtensionBuilder
