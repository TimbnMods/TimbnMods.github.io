  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Gets a model by its prefab name. The bundle has to be built with the game's Unity version (6000.3.9f1), and

    its prefabs can't carry game scripts.
  example: []
  syntax:
    content: public TimbnModel Model(string prefabName)
    parameters:
    - id: prefabName
      type: System.String
      description: The prefab's name in the bundle, for example "RedWorkbench".
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel
      description: The model, the same one each time for a name.
    content.vb: Public Function Model(prefabName As String) As TimbnModel
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModelBundle.Model*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: The bundle has no prefab with that name.
