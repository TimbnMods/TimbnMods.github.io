  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Shows a line of text in the game's own notification popup, the one it uses for things like a closed shop. The

    text is looked up by its localization key, so add it with Text.Add or a lang file. It can name an item or an

    NPC with the game's #(id) markup.
  example:
  - <pre><code class="lang-csharp">TimbnUI.Notify("my_mod_parcel_lost");</code></pre>
  syntax:
    content: public static void Notify(string key)
    parameters:
    - id: key
      type: System.String
      description: The text's localization key.
    content.vb: Public Shared Sub Notify(key As String)
