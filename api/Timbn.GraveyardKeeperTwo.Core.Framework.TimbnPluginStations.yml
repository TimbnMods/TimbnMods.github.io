    startLine: 45
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a workstation the player builds from a build desk. Placing it puts down a construction site that the player works

    off with the hammer, then the station appears in its place, and the build desk's remove tool dismantles it for a

    refund. See <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder" data-throw-if-not-resolved="false"></xref> for what a station can hold. Call it in OnAwake, before the crafts

    that run at it.
  example:
  - >-
    A box that splits boards into sticks, worked like the sawhorse and taking a tool rack.


    <pre><code class="lang-csharp">var box = Stations.Add("timbn_stick_box", "Stick Box", "A red box for splitting boards into sticks.", station =&gt; station
        .Model(bundle.Model("RedBox"), new Vector3(1f, 0.6f, 1f))
        .Site(bundle.Model("RedBoxSite"))
        .BasedOn("sawhorse")
        .Icon("timbn_stick_box")
        .Cost(("flitch", 2))
        .Extensions("tool_rack"));</code></pre>
  syntax:
    content: public TimbnStation Add(string id, string name, string description, Action<TimbnStationBuilder> station)
    parameters:
    - id: id
      type: System.String
      description: The station's world object id, for example "timbn_stick_box". Keep it stable, since saves name a built station by it.
    - id: name
      type: System.String
      description: The name shown in the build desk and over the station. Empty leaves the text to the plugin's lang files.
    - id: description
      type: System.String
      description: The description shown in the build desk. Empty leaves it to the lang files.
    - id: station
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder}
      description: Describes the station.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStation
      description: >-
        The station, for naming it in a craft's In. It lives until the plugin unloads, so unlike an extension or a craft

        there is no handle to remove it early.
    content.vb: Public Function Add(id As String, name As String, description As String, station As Action(Of TimbnStationBuilder)) As TimbnStation
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginStations.Add*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The id is empty.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: No model was given.
