        .Model(bundle.Model("RedBox"), new Vector3(1f, 0.6f, 1f))
        .BasedOn("sawhorse")
        .Cost(("flitch", 2)));</code></pre>

    with lang/en.txt holding timbn_stick_box, timbn_stick_box_place, timbn_stick_box_place_p and

    timbn_stick_box_place_p_d.
