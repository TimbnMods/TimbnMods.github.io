  summary: >-
    Adds a workstation whose name and build desk description come from the plugin's lang files. The station and its

    construction site are named under the station's id, and the build desk entry under its BuildingId with the

    description under BuildingId_d. See <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginStations.Add(System.String%2cSystem.String%2cSystem.String%2cSystem.Action%7bTimbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder%7d)" data-throw-if-not-resolved="false"></xref>.
