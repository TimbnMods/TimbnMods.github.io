  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds a bench extension like the game's tool rack, placed straight from a build desk with no construction site. It

    attaches to a station that lists it in <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnStationBuilder.Extensions(System.String%2cSystem.String%5b%5d)" data-throw-if-not-resolved="false"></xref> when the two stand next to

    each other, and crafts that call NeedsExtension with its id open at that station while it is attached. See

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnExtensionBuilder" data-throw-if-not-resolved="false"></xref> for what an extension can hold. Call it in OnAwake.
  example: []
  syntax:
    content: public IDisposable AddExtension(string id, string name, string description, Action<TimbnExtensionBuilder> extension)
    parameters:
    - id: id
      type: System.String
      description: The extension's world object id, for example "timbn_red_magic". Keep it stable, since saves name a built extension by it.
    - id: name
      type: System.String
      description: The name shown in the build desk. Empty leaves the text to the plugin's lang files.
    - id: description
      type: System.String
      description: The description shown in the build desk. Empty leaves it to the lang files.
    - id: extension
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnExtensionBuilder}
      description: Describes the extension.
    return:
      type: System.IDisposable
      description: A handle that removes the extension early when disposed. You don't need to keep it.
