    id: FadeThrough
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/UI/TimbnPluginUI.cs
    startLine: 31
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Fades the screen to black, runs your code while it is black, and fades back in, the way the game hides a

    change such as the player sitting down or a teleport. The code can be called off before the screen goes black,

    such as when the player changes their mind during the fade. When the game has no fade to show, or one is

    already showing, the code runs straight away.
  example:
  - >-
    <pre><code class="lang-csharp">_fade?.Dispose();

    _fade = UI.FadeThrough(SitDown);</code></pre>
  syntax:
    content: public IDisposable FadeThrough(Action whileBlack)
    parameters:
    - id: whileBlack
      type: System.Action
      description: The code to run once the screen is black.
    return:
      type: System.IDisposable
      description: A handle that calls the code off when disposed. It is also called off when the plugin unloads and on the way to the main menu.
    content.vb: Public Function FadeThrough(whileBlack As Action) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginUI.FadeThrough*
