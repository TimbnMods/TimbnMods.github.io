  source:
    remote:
      path: src/Timbn.GraveyardKeeperTwo.Core/UI/TimbnPluginUI.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: ShowPrompt
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/UI/TimbnPluginUI.cs
    startLine: 115
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Asks the player for one line of text in the game's own dialog window, with the text field under the header and

    OK and Cancel buttons, such as to name a chest. Typing never sets off the game's hotkeys, the keeper is held and

    the game pauses the way it does for any dialog. Saving with empty text still calls the handler, so a plugin can

    treat it as a removal. Only one plugin dialog is open at a time, and opening another closes the first without

    calling any handler. Nothing opens while another of the game's dialogs is showing.
  example:
  - <pre><code class="lang-csharp">UI.ShowPrompt("Chest Label", Data.Current.Labels[id], text =&gt; Data.Current.Labels[id] = text, "Type a name");</code></pre>
  syntax:
    content: public IDisposable ShowPrompt(string title, string current, Action<string> onSave, string placeholder = "", Action? onCancel = null)
    parameters:
    - id: title
      type: System.String
      description: The window's header, already in the player's language.
    - id: current
      type: System.String
      description: The text the field starts with.
    - id: onSave
      type: System.Action{System.String}
      description: Gets the typed text when the player presses OK or Enter.
    - id: placeholder
      type: System.String
      description: The hint shown in the empty field.
    - id: onCancel
      type: System.Action
      description: Runs when the player backs out with Cancel, the close button or Esc.
    return:
      type: System.IDisposable
      description: A handle that closes the window without calling any handler when disposed. It is also closed when the plugin unloads and on the way to the main menu. You don't need to keep it.
    content.vb: Public Function ShowPrompt(title As String, current As String, onSave As Action(Of String), placeholder As String = "", onCancel As Action = Nothing) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginUI.ShowPrompt*
  nameWithType.vb: TimbnPluginUI.ShowPrompt(String, String, Action(Of String), String, Action)
  fullName.vb: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginUI.ShowPrompt(String, String, System.Action(Of String), String, System.Action)
  name.vb: ShowPrompt(String, String, Action(Of String), String, Action)
