  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes an IMGUI window for a debug or cheat menu. Core draws the box, a title line that names the key to

    close it, and a "load a save" note, so you only draw what goes inside. The window is taken down when the

    plugin unloads. Set its <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGuiWindow.Area" data-throw-if-not-resolved="false"></xref> and the other properties on the returned window.
  example:
  - <pre><code class="lang-csharp">var menu = UI.CreateDebugWindow("Timbn Cheats", DrawCheats, PluginConfig.ToggleMenu);</code></pre>
  syntax:
    content: public TimbnGuiWindow CreateDebugWindow(string title, Action draw, ConfigEntry<KeyboardShortcut>? toggle = null)
    parameters:
    - id: title
      type: System.String
      description: The window's title, drawn on its first line with the key that closes it.
    - id: draw
      type: System.Action
      description: Draws the contents with GUILayout calls. It runs only while the window is visible.
    - id: toggle
      type: BepInEx.Configuration.ConfigEntry{BepInEx.Configuration.KeyboardShortcut}
      description: The key that opens and closes the window, or null to set <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGuiWindow.IsVisible" data-throw-if-not-resolved="false"></xref> from code.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGuiWindow
      description: The window.
    content.vb: Public Function CreateDebugWindow(title As String, draw As Action, toggle As ConfigEntry(Of KeyboardShortcut) = Nothing) As TimbnGuiWindow
