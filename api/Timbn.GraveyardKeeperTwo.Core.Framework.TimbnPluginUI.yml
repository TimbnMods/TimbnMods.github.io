      path: src/Timbn.GraveyardKeeperTwo.Core/UI/TimbnPluginUI.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: OpenStorage
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/UI/TimbnPluginUI.cs
    startLine: 94
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Opens the game's chest window on a storage only the plugin knows about, such as a keg, with the player's

    inventory beside it so they move items in and out the usual way. The storage is a list of item ids and

    counts the plugin keeps, usually in its save data, and every move the player makes is written back into it

    at once.
  example:
  - <pre><code class="lang-csharp">UI.OpenStorage(Data.Current.Keg, "my_mod_keg", 10, "beer");</code></pre>
  syntax:
    content: public IDisposable OpenStorage(IDictionary<string, int> contents, string titleKey, int slots, params string[] itemIds)
    parameters:
    - id: contents
      type: System.Collections.Generic.IDictionary{System.String,System.Int32}
      description: The items in the storage, item id to count. It is changed as the player moves items.
    - id: titleKey
      type: System.String
      description: A text key added with Text.Add, shown over the storage, such as "Keg".
    - id: slots
      type: System.Int32
      description: How many slots the storage has. Items that do not fit stay in the contents but are not shown.
    - id: itemIds
      type: System.String[]
      description: The only items the player may put in. Leave it out to take anything.
    return:
      type: System.IDisposable
      description: A handle that closes the window when disposed, if it is still open. It is also closed when the plugin unloads and on the way to the main menu. You don't need to keep it.
    content.vb: Public Function OpenStorage(contents As IDictionary(Of String, Integer), titleKey As String, slots As Integer, ParamArray itemIds As String()) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginUI.OpenStorage*
