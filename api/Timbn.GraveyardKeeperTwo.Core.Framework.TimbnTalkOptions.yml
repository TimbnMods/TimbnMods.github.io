    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Dialog/TimbnTalkOptions.cs
    startLine: 14
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes the talk a one-shot. Once the player starts it in a save, the NPC stops offering it in that save,

    even after a reload. It is marked when the conversation starts and written to disk when the game next

    finishes saving, so a player who quits without saving sees it again. See

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginDialog.ResetTalk(System.String)" data-throw-if-not-resolved="false"></xref> to offer it again.
  example: []
  syntax:
    content: public bool Once { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property Once As Boolean
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTalkOptions.Once*
