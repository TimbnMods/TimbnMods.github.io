    startLine: 15
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    A trip off a person's origin for the <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcSteps.ChainTrips(System.Func%7bTimbn.GraveyardKeeperTwo.Core.Framework.TimbnNpc%2cTimbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcTrip%2cTimbn.GraveyardKeeperTwo.Core.Framework.TimbnNpcTrip%7d)" data-throw-if-not-resolved="false"></xref> step, in three parts. Leave runs only when the

    trip starts from the origin, the body always runs, and Return runs only when no next trip chains on, so trips can

    follow each other without going back to the origin in between.
  example:
  - >-
    <pre><code class="lang-csharp">new TimbnNpcTrip()
        .Leave(steps =&gt; steps.WalkNavmesh("npc_sim_village_right_side_road_34"))
        .Body(steps =&gt; steps.Walk("npc_sim_village_right_side_03").WaitGameMinutes(45))
        .Return(steps =&gt; steps.Walk("npc_sim_village_right_side_road_34").WalkNavmesh("RT_herm_spawn"));</code></pre>
