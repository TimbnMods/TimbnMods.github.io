  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Holds a plugin's own data that belongs to no save. Core fills <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnData%601.Current" data-throw-if-not-resolved="false"></xref> when the plugin

    starts and writes it to disk when the game saves, when the player returns to the main menu, when the game quits,

    when the plugin unloads, and whenever <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGlobalData%601.Save" data-throw-if-not-resolved="false"></xref> is called. Get one from Saves.RegisterGlobal.
  example: []
  syntax:
    content: 'public sealed class TimbnGlobalData<T> : TimbnData<T> where T : class, new()'
    typeParameters:
    - id: T
      description: The plugin's global data type.
