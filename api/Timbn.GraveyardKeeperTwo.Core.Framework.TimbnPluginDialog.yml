    id: AddMenuAnswer
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Dialog/TimbnPluginDialog.cs
    startLine: 145
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Adds an answer of your own to the menu an NPC or an object opens when the player interacts, next to the game's

    own answers and above Leave, the way a quest adds its turn in. Picking it takes its cost, plays the lines that

    follow, and shows the menu again. isOffered, needs and cost are read each time the menu opens, so a price can

    follow a setting. The text can color any part of itself, with the game's highlight in square brackets or any

    color in a color tag, and buttonColor gives the answer's button a color of its own.
  example:
  - >-
    <pre><code class="lang-csharp">Dialog.AddMenuAnswer(TimbnGameIds.Npcs.TavernOwner, "my_mod_hire", () =&gt; !_booked, "Play at my [tavern] tonight.",
        then =&gt; then.Say("I'll bring my violin.").RunCode(() =&gt; _booked = true),
        cost: cost =&gt; cost.Money(500));

    Dialog.AddMenuAnswer("royal_mailbox", "my_mod_burn", () =&gt; true, "&lt;color=#ff6050&gt;Burn the letters&lt;/color&gt;",
        buttonColor: new Color(0.45f, 0.12f, 0.1f));</code></pre>
  syntax:
    content: public IDisposable AddMenuAnswer(string targetId, string answerId, Func<bool> isOffered, string text, Action<TimbnLines>? then = null, Action<TimbnNeeds>? needs = null, Action<TimbnCost>? cost = null, Color? buttonColor = null)
    parameters:
    - id: targetId
      type: System.String
      description: The NPC, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>, or the id of an object with a menu, such as royal_mailbox.
    - id: answerId
      type: System.String
      description: A unique id for the answer. It is the answer's localization key, and the lines that follow are answerId_1, answerId_2 and so on.
    - id: isOffered
      type: System.Func{System.Boolean}
      description: Whether the answer shows right now. A throw counts as false and is logged.
    - id: text
      type: System.String
      description: The answer as the player sees it.
    - id: then
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLines}
      description: What follows it, such as the NPC's reply and code with RunCode. Leave it out to go straight back to the menu.
    - id: needs
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnNeeds}
      description: What has to be true to pick it, shown as a lock. The answer is grayed out until it is met.
    - id: cost
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnCost}
      description: What the player pays when they pick it, shown as a price. The answer is grayed out until they can pay.
    - id: buttonColor
      type: System.Nullable{UnityEngine.Color}
      description: The color of the answer's button, shaded on hover like the game's own. Leave it out for the game's own.
    return:
      type: System.IDisposable
      description: A handle that removes the answer early when disposed. You don't need to keep it.
    content.vb: Public Function AddMenuAnswer(targetId As String, answerId As String, isOffered As Func(Of Boolean), text As String, [then] As Action(Of TimbnLines) = Nothing, needs As Action(Of TimbnNeeds) = Nothing, cost As Action(Of TimbnCost) = Nothing, buttonColor As Color? = Nothing) As IDisposable
