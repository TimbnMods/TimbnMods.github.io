    id: AddTalk
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Dialog/TimbnPluginDialog.cs
    startLine: 60
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Gives an NPC a conversation of your own. While isOffered returns true the NPC shows a speech icon, and when

    the player interacts, the conversation plays in place of the NPC's own. The player's control is taken while it

    plays and given back when it ends. isOffered is checked about once a second. Each line is the text itself, and

    Core names its localization key after the talk id (talkId_1, talkId_2 and so on, in the order the lines are

    written), so a lang file can translate it. Add new lines at the end of a talk that has shipped, since a line put

    in the middle moves every key after it and a translation would show the wrong lines. The lines are recorded

    once, here, so pick between lines with When and fill in changing values with a <code>Func&lt;object&gt;</code>.
  example:
  - >-
    Larry asks for wine while the player is carrying some, and a tip he gives once per save in a bubble color of

    its own.


    <pre><code class="lang-csharp">Dialog.AddTalk(TimbnGameIds.Npcs.Larry, "my_larry_wine", () =&gt; TimbnItems.CountOnPlayer("grape_wine:1") &gt; 0, lines =&gt; lines
        .Say("Is that wine you're carrying?")
        .Ask(ask =&gt; ask
            .Answer("Have a bottle.", then =&gt; then.Say("Lovely."), cost: cost =&gt; cost.Item("grape_wine:1"))
            .Answer("It's not for you.")));

    Dialog.AddTalk(TimbnGameIds.Npcs.Larry, "my_larry_tip", () =&gt; true, lines =&gt; lines.Say("Herm sells nails."),
        new TimbnTalkOptions { Once = true, BubbleColor = new Color(0.6f, 0.8f, 1f) });</code></pre>
  syntax:
    content: public IDisposable AddTalk(string npcId, string talkId, Func<bool> isOffered, Action<TimbnLines> lines, TimbnTalkOptions? options = null)
    parameters:
    - id: npcId
      type: System.String
      description: The NPC, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>, such as TimbnGameIds.Npcs.Larry.
    - id: talkId
      type: System.String
      description: A unique id for this talk. It becomes the NPC's interaction event and the start of its text keys, and reusing an id on another NPC throws.
    - id: isOffered
      type: System.Func{System.Boolean}
      description: Whether the talk is available right now. A throw counts as false and is logged.
    - id: lines
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLines}
      description: Writes the conversation's lines.
    - id: options
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTalkOptions
      description: Optional settings, such as making the talk a one-shot or giving it its own bubble color.
    return:
      type: System.IDisposable
      description: A handle that removes the talk early when disposed. You don't need to keep it.
    content.vb: Public Function AddTalk(npcId As String, talkId As String, isOffered As Func(Of Boolean), lines As Action(Of TimbnLines), options As TimbnTalkOptions = Nothing) As IDisposable
