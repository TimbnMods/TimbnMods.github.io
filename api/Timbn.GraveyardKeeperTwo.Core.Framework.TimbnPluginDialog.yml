  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Gives an NPC a conversation that is written each time the player talks, so plain C# can pick and fill the lines

    from the game's state, such as what the player carries. Everything else works the same as AddTalk. A numbered

    key can belong to a different line from one talk to the next, so give a Key to any line a lang file translates.
  example:
  - >-
    <pre><code class="lang-csharp">Dialog.AddDynamicTalk(TimbnGameIds.Npcs.Larry, "my_larry_boards", () =&gt; true, lines =&gt;

    {
        var boards = TimbnItems.CountOnPlayer("flitch");
        if (boards == 0)
            lines.Say("No boards? Go chop some trees.").Named("none");
        else
            lines.Say("You have %1 boards.", boards).Named("some");
    });</code></pre>
  syntax:
    content: public IDisposable AddDynamicTalk(string npcId, string talkId, Func<bool> isOffered, Action<TimbnLines> lines, TimbnTalkOptions? options = null)
    parameters:
    - id: npcId
      type: System.String
      description: The NPC, from <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnGameIds.Npcs" data-throw-if-not-resolved="false"></xref>, such as TimbnGameIds.Npcs.Larry.
    - id: talkId
      type: System.String
      description: A unique id for this talk. It becomes the NPC's interaction event and the start of its text keys, and reusing an id on another NPC throws.
    - id: isOffered
      type: System.Func{System.Boolean}
      description: Whether the talk is available right now. A throw counts as false and is logged.
    - id: lines
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnLines}
      description: Writes the conversation's lines, each time the player talks. A throw is logged and ends the talk.
    - id: options
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnTalkOptions
      description: Optional settings, such as making the talk a one-shot or giving it its own bubble color.
    return:
      type: System.IDisposable
      description: A handle that removes the talk early when disposed. You don't need to keep it.
    content.vb: Public Function AddDynamicTalk(npcId As String, talkId As String, isOffered As Func(Of Boolean), lines As Action(Of TimbnLines), options As TimbnTalkOptions = Nothing) As IDisposable
