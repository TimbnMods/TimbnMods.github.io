      path: src/Timbn.GraveyardKeeperTwo.Core/Events/TimbnPluginEvents.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: BeforeSave
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Events/TimbnPluginEvents.cs
    startLine: 90
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Runs just before the game writes the save you are playing, ahead of Core taking out the mod content it keeps

    out of the file. Use it to put back what a mod changed in the world that the save would otherwise keep, such as

    a visitor standing in the graveyard, and bring it back in <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginEvents.AfterSave(System.Action)" data-throw-if-not-resolved="false"></xref>. Core strips its own content

    after every plugin's handler has run, so nothing a handler leaves behind reaches the file. It runs for every

    write of the live save.
  example:
  - <pre><code class="lang-csharp">Events.BeforeSave(visits.SendAway);</code></pre>
  syntax:
    content: public IDisposable BeforeSave(Action handler)
    parameters:
    - id: handler
      type: System.Action
      description: Your handler.
    return:
      type: System.IDisposable
      description: A handle that unsubscribes early when disposed. You don't need to keep it.
    content.vb: Public Function BeforeSave(handler As Action) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginEvents.BeforeSave*
