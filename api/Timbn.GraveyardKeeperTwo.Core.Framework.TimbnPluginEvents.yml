  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Runs when a zombie's view has been given its body, head, and skin, right after the view spawns and again

    whenever the zombie is restyled. Use it to change how a zombie looks, since the game redraws the view from

    its data and would undo a change made at any other time.
  example:
  - <pre><code class="lang-csharp">Events.ZombieViewReady((part, zombie) =&gt; ZombieTint.Paint(part, ZombieTint.Read(zombie)));</code></pre>
  syntax:
    content: public IDisposable ZombieViewReady(Action<WgoPart, ZombieWgoData> handler)
    parameters:
    - id: handler
      type: System.Action{WgoPart,ZombieWgoData}
      description: Gets the part of the view that draws the zombie, whose Wgo is the view, and the zombie.
    return:
      type: System.IDisposable
      description: A handle that unsubscribes early when disposed. You don't need to keep it.
    content.vb: Public Function ZombieViewReady(handler As Action(Of WgoPart, ZombieWgoData)) As IDisposable
