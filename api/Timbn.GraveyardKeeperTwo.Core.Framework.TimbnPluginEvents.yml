      path: src/Timbn.GraveyardKeeperTwo.Core/Events/TimbnPluginEvents.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: SaveReady
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Events/TimbnPluginEvents.cs
    startLine: 44
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Runs for every save the player plays, once the scene is loaded and MainGame.Instance, PlayerData and

    WorldData are live. It runs straight away when a save is already loaded, which covers a plugin started by a

    hot reload mid game, and then each time a save finishes loading.
  example:
  - '<pre><code class="lang-csharp">Events.SaveReady(() =&gt; ZombieTint.PaintAll(reset: false));</code></pre>'
  syntax:
    content: public IDisposable SaveReady(Action handler)
    parameters:
    - id: handler
      type: System.Action
      description: Your handler.
    return:
      type: System.IDisposable
      description: A handle that unsubscribes early when disposed. You don't need to keep it.
    content.vb: Public Function SaveReady(handler As Action) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginEvents.SaveReady*
