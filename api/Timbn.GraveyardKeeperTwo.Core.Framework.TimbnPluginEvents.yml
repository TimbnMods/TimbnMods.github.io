    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Events/TimbnPluginEvents.cs
    startLine: 14
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Subscribes a plugin to the game's events without any cleanup code. Every subscription is owned by the

    plugin and removed when it unloads, so an F6 hot reload never leaves an old handler firing. The named events

    are the ones Core adds something to and the ones mods commonly need, such as a new day or the player using an

    item, and those that belong to a save follow every save the player loads. Any other game event is one line of

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginEvents.GameEvent(System.Action%2cSystem.Action%7bSystem.Action%7d%2cSystem.Action%7bSystem.Action%7d)" data-throw-if-not-resolved="false"></xref>,

    or of <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginEvents.SaveEvent(System.Action%2cSystem.Action%7bSystem.Action%7d%2cSystem.Action%7bSystem.Action%7d)" data-throw-if-not-resolved="false"></xref> for an event on an object that belongs to

    the loaded save. Each handler is wrapped so a throw is logged instead of reaching the game. Reach it through the

    plugin's Events property.
  example: []
  syntax:
    content: public sealed class TimbnPluginEvents
    content.vb: Public NotInheritable Class TimbnPluginEvents
