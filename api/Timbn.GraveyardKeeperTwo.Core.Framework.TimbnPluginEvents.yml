    startLine: 65
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Runs when the player stops playing a save, whether they return to the main menu or the plugin unloads mid

    game, such as on a hot reload. It is the one place to put back what the plugin changed in the world for

    that save. On unload it runs after OnUnload and before Core removes the plugin's other registrations.
  example:
  - <pre><code class="lang-csharp">Events.SaveClosed(meditation.Stop);</code></pre>
  syntax:
    content: public IDisposable SaveClosed(Action handler)
    parameters:
    - id: handler
      type: System.Action
      description: Your handler.
    return:
      type: System.IDisposable
      description: A handle that unsubscribes early when disposed, without running the handler. You don't need to keep it.
    content.vb: Public Function SaveClosed(handler As Action) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginEvents.SaveClosed*
