  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Runs at most once every <code class="paramref">seconds</code> while a save is loaded and the game is not paused, and it

    starts on the first frame after it is added. The seconds are real time, so they do not speed up while the

    player sleeps. It never runs on the main menu. If the handler throws, the error is logged once and the

    handler is stopped.
  example:
  - <pre><code class="lang-csharp">Events.EveryRealSeconds(0.5f, () =&gt; stuckCarriers.Tick());</code></pre>
  syntax:
    content: public IDisposable EveryRealSeconds(float seconds, Action handler)
    parameters:
    - id: seconds
      type: System.Single
      description: The shortest time between runs. Zero or less runs on every frame.
    - id: handler
      type: System.Action
      description: Your handler.
    return:
      type: System.IDisposable
      description: A handle that unsubscribes early when disposed. You don't need to keep it.
    content.vb: Public Function EveryRealSeconds(seconds As Single, handler As Action) As IDisposable
