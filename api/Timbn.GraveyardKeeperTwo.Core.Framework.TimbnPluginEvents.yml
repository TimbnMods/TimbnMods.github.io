      path: src/Timbn.GraveyardKeeperTwo.Core/Events/TimbnPluginEvents.cs
      branch: main
      repo: https://github.com/TimbnMods/Timbn.GraveyardKeeperTwo.git
    id: GameEvent
    path: ../Timbn.GraveyardKeeperTwo/src/Timbn.GraveyardKeeperTwo.Core/Events/TimbnPluginEvents.cs
    startLine: 432
  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Subscribes to a static game event that has no named method here. The handler is wrapped so a throw is

    logged instead of reaching the game, the subscription is owned by the plugin, and it is removed when the

    plugin unloads, so there is nothing to clean up. It hooks the event once, so use it only for static events.

    An event on an object that belongs to a save (quests, the player's data) needs

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginEvents.SaveEvent(System.Action%2cSystem.Action%7bSystem.Action%7d%2cSystem.Action%7bSystem.Action%7d)" data-throw-if-not-resolved="false"></xref>, which hooks it again for each save.
  example:
  - >-
    Log every tech the player unlocks, using the game's static KnowledgeSystem.OnTechUnlocked event, which

    passes the tech id and whether the unlock was silent.


    <pre><code class="lang-csharp">Events.GameEvent&lt;string, bool&gt;(
        (techId, silent) =&gt; Logger.LogInfo($"Unlocked {techId}"),
        h =&gt; KnowledgeSystem.OnTechUnlocked += h,
        h =&gt; KnowledgeSystem.OnTechUnlocked -= h);</code></pre>
  syntax:
    content: public IDisposable GameEvent(Action handler, Action<Action> add, Action<Action> remove)
    parameters:
    - id: handler
      type: System.Action
      description: Your handler.
    - id: add
      type: System.Action{System.Action}
      description: Subscribes a handler to the event, such as <code>h =&gt; KnowledgeSystem.OnTechUnlocked += h</code>.
    - id: remove
      type: System.Action{System.Action}
      description: Unsubscribes it again, such as <code>h =&gt; KnowledgeSystem.OnTechUnlocked -= h</code>.
    return:
      type: System.IDisposable
      description: A handle that unsubscribes early when disposed. You don't need to keep it.
    content.vb: Public Function GameEvent(handler As Action, add As Action(Of Action), remove As Action(Of Action)) As IDisposable
