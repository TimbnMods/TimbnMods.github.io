  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes a model an extra part that the game hangs on a world object with the AddWgoPart expression, the way a

    headstone or a fence goes on a grave. The part sits at the world object's origin, so the offset goes into the

    prefab, for example a headstone 0.3 units toward the back of the grave with its base 0.13 up. A part is walked

    through unless it gets a solid box. A fence needs one, since a grave hides its own mound and collision while a

    fence is in it and expects the fence to bring both. A part hung on a world object is kept out of the game's

    save while the game writes it and put back on load, so the save still loads once the mod is gone.
  example: []
  syntax:
    content: public IDisposable AddPart(string partId, TimbnModel model, Bounds? solid = null)
    parameters:
    - id: partId
      type: System.String
      description: The id AddWgoPart and RemoveWgoPart use, for example "timbn_grave_bot_1".
    - id: model
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel
      description: The model to draw.
    - id: solid
      type: System.Nullable{UnityEngine.Bounds}
      description: >-
        A box the player bumps into, in the world object's space, or null for none. For example

        <code>new Bounds(new Vector3(0f, 0.3f, 0.075f), new Vector3(0.6f, 0.6f, 1f))</code> covers a grave.
    return:
      type: System.IDisposable
      description: A handle that removes the part's look early when disposed. You don't need to keep it.
    content.vb: Public Function AddPart(partId As String, model As TimbnModel, solid As Bounds? = Nothing) As IDisposable
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginModels.AddPart*
