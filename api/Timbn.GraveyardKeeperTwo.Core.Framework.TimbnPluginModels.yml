  assemblies:
  - Timbn.GraveyardKeeperTwo.Core
  namespace: Timbn.GraveyardKeeperTwo.Core.Framework
  summary: >-
    Makes a model from PNGs with no 3D modeling and no Unity, drawn with the game's own prop shader so it takes

    the game's lighting. Each PNG is a face exactly as the player sees it (a front standing up, a top lying flat,

    or a block that is both), its own size is the face's size, and you only say where it stands (see

    <xref href="Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModelFaces" data-throw-if-not-resolved="false"></xref>). Hand the result to the plugin's Stations or AddPart. It is freed when the

    plugin unloads.
  example: []
  syntax:
    content: public TimbnModel Build(string name, Action<TimbnModelFaces> build)
    parameters:
    - id: name
      type: System.String
      description: The model's name, for example "PcDesk".
    - id: build
      type: System.Action{Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModelFaces}
      description: Adds the model's faces.
    return:
      type: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnModel
      description: The model, ready for a station's Model.
    content.vb: Public Function Build(name As String, build As Action(Of TimbnModelFaces)) As TimbnModel
  overload: Timbn.GraveyardKeeperTwo.Core.Framework.TimbnPluginModels.Build*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      The model has no faces, a PNG is missing or unreadable, a block's depth leaves no front, or two faces on the

      same plane overlap.
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: A face's position is below zero or a block's depth is below 1.
